# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Cookie/CSRF signing secrets for the Kratos self-service UI.
# Required Bitwarden keys: ORY_KRATOS_UI_COOKIE_SECRET, ORY_KRATOS_UI_CSRF_SECRET (random >= 32 chars)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kratos-ui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: kratos-ui-secret
    template:
      data:
        COOKIE_SECRET: "{{ .ORY_KRATOS_UI_COOKIE_SECRET }}"
        CSRF_COOKIE_SECRET: "{{ .ORY_KRATOS_UI_CSRF_SECRET }}"
  data:
    - secretKey: ORY_KRATOS_UI_COOKIE_SECRET
      remoteRef: { key: ORY_KRATOS_UI_COOKIE_SECRET }
    - secretKey: ORY_KRATOS_UI_CSRF_SECRET
      remoteRef: { key: ORY_KRATOS_UI_CSRF_SECRET }
