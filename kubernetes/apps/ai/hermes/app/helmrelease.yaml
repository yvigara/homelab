apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          init:
            image: &app_image
              repository: nousresearch/hermes-agent
              tag: v2026.8.16.2@sha256:a39fc11620213e3669a327aff5c6cb1eb2b8a238c6044e33e7ef8885833d89a7
            env:
              HOME: /opt/data
              MISE_VERSION: v2026.8.8
              MISE_INSTALL_PATH: /opt/data/.local/bin/mise
              MISE_INSTALL_SKIP_IF_EXISTS: "1"
              MISE_YES: "1"
              # Public half only: the private key never leaves the ssh-agent container.
              SSH_SIGNING_KEY_PUB:
                valueFrom:
                  secretKeyRef:
                    name: hermes-signing-key
                    key: SSH_SIGNING_KEY_PUB
              GIT_COMMITTER_NAME: &committer_name yvigara
              GIT_COMMITTER_EMAIL: &committer_email 704600+yvigara@users.noreply.github.com
            envFrom:
              - secretRef:
                  name: hermes-github-app
            dependsOn: ssh-agent
            command:
              - bash
              - -c
              - |
                set -euo pipefail
                cp /run/config/config.yaml /opt/data/config.yaml
                chown hermes:hermes /opt/data/config.yaml

                echo 'export PATH="/opt/data/.local/bin:/opt/data/.local/share/mise/shims:$PATH"' > /opt/data/.profile

                mkdir -p /opt/data/.config/mise /opt/data/.local/bin \
                  /opt/data/.local/share/mise /opt/data/.local/state/mise /opt/data/.cache/mise
                cp /run/config/mise.toml /opt/data/.config/mise/config.toml

                # no-ops when $MISE_INSTALL_PATH is already at $MISE_VERSION
                curl -fsSL https://mise.run | sh

                # real activation for interactive `kubectl exec` shells
                touch /opt/data/.bashrc
                grep -qF '/opt/data/.local/bin/mise activate bash' /opt/data/.bashrc \
                  || echo 'eval "$(/opt/data/.local/bin/mise activate bash)"' >> /opt/data/.bashrc

                mkdir -p /opt/data/.cache/mise
                chown -R hermes:hermes /opt/data/.bashrc /opt/data/.config/mise \
                  /opt/data/.local/bin/mise /opt/data/.local/share/mise \
                  /opt/data/.local/state/mise /opt/data/.cache/mise \
                  /opt/data/.profile
                su - hermes -c "$MISE_INSTALL_PATH install"

                # git config + GitHub App credential helper, from hermes-github-app
                bash /run/config/git-init.sh
          # Native sidecar: starts before the app container and keeps running, so
          # the signing key is loaded in the agent by the time hermes commits.
          ssh-agent:
            image: *app_image
            restartPolicy: Always
            # Matches HERMES_UID/HERMES_GID so the agent socket is usable by the
            # hermes process in the app container.
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            envFrom:
              - secretRef:
                  name: hermes-signing-key
            command:
              - bash
              - -c
              - exec bash /run/config/ssh-agent.sh
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image: *app_image
            args:
              - "gateway"
              - "run"
            env:
              TZ: ${TIMEZONE}
              API_SERVER_ENABLED: true
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_PORT: &app_port 8642
              HERMES_GID: "1000"
              HERMES_HOME: /opt/data
              HERMES_UID: "1000"
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_PUBLIC_URL: "https://hermes.${DOMAIN}"
              HERMES_DASHBOARD_OIDC_ISSUER: "https://dex.${DOMAIN}"
              HERMES_DASHBOARD_OIDC_CLIENT_ID: "hermes-dashboard-public"
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              MEMINI_NAMESPACE: hermes
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: MEMINI_API_KEY
              SEARXNG_URL: http://searxng.ai.svc.cluster.local:8080
              WHATSAPP_ENABLED: true
              WHATSAPP_MODE: self-chat
              HOME: /opt/data
              TERM: xterm-256color
              SSH_AUTH_SOCK: /run/ssh-agent/agent.sock
              # Author stays hermes[bot] (user.email in the gitconfig); GitHub
              # verifies SSH signatures against the committer, and only a user
              # account can own a signing key.
              GIT_COMMITTER_NAME: *committer_name
              GIT_COMMITTER_EMAIL: *committer_email
              PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/opt/data/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            envFrom:
              - configMapRef:
                  name: cluster-vars
              - secretRef:
                  name: hermes-secret
              - secretRef:
                  name: hermes-github-app
            ports:
              - containerPort: *app_port
                name: gateway
                protocol: TCP
              - containerPort: &dashboard_port 9119
                name: dashboard
                protocol: TCP
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
    service:
      app:
        controller: hermes
        ports:
          gateway:
            port: *app_port
          dashboard:
            port: *dashboard_port
    route:
      dashboard:
        hostnames:
          - "hermes.int.${REGION}.${ENVIRONMENT}.${DOMAIN}"
        parentRefs:
          - name: traefik-private
            namespace: network
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
      public-dashboard:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - "hermes.${DOMAIN}"
        parentRefs:
          - name: traefik-public
            namespace: network
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
      api:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - "hermes-api.${DOMAIN}"
        parentRefs:
          - name: traefik-public
            namespace: network
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: gateway
    persistence:
      data:
        existingClaim: hermes
        globalMounts:
          - path: /opt/data
      config:
        type: configMap
        name: hermes-configmap
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/config.yaml
                subPath: config.yaml
              - path: /run/config/mise.toml
                subPath: mise.toml
              - path: /run/config/git-init.sh
                subPath: git-init.sh
            ssh-agent:
              - path: /run/config/ssh-agent.sh
                subPath: ssh-agent.sh
      # Socket only, shared with the app container.
      ssh-agent:
        type: emptyDir
        medium: Memory
        advancedMounts:
          hermes:
            ssh-agent:
              - path: /run/ssh-agent
            app:
              - path: /run/ssh-agent
      # Where the key is briefly written to be encrypted and loaded. Not shared.
      ssh-key:
        type: emptyDir
        medium: Memory
        advancedMounts:
          hermes:
            ssh-agent:
              - path: /run/ssh-key
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /run
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
