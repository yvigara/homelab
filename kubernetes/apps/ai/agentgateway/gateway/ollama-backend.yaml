apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: ollama
  namespace: agentgateway-system
spec:
  ai:
    provider:
      custom:
        model: qwen3.5:9b-mlx
        formats:
          - type: Completions
            path: /v1/chat/completions
          - type: Messages
            path: /v1/messages
          - type: Embeddings
            path: /v1/embeddings
          - type: Responses
            path: /v1/responses
      host: "${OLLAMA_SRV1_IP}"
      port: 11434
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ollama
      backendRefs:
        - name: ollama
          kind: AgentgatewayBackend
          group: agentgateway.dev
