apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: omlx
  namespace: agentgateway-system
spec:
  ai:
    provider:
      custom:
        formats:
          - type: Completions
            path: /v1/chat/completions
          - type: Messages
            path: /v1/messages
          - type: Embeddings
            path: /v1/embeddings
          - type: Responses
            path: /v1/responses
      host: "${OLLAMA_SRV1_IP}"
      port: 8000
  policies:
    auth:
      secretRef:
        name: omlx-secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omlx
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /omlx
      backendRefs:
        - name: omlx
          kind: AgentgatewayBackend
          group: agentgateway.dev
