# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-knowledge
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        # The image declares no USER and would otherwise run as root. The alpine
        # base carries `node` at 1000:1000, and the CLI is a world-readable
        # global npm install, so it runs fine unprivileged; fsGroup hands it
        # both the project volume and the home emptyDir.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      open-knowledge:
        annotations:
          reloader.stakater.com/auto: "true"
        # The collaboration server is single-writer: exactly one process per
        # project volume. Recreate (not RollingUpdate) keeps a new pod from
        # attaching to the volume while the old one still holds it.
        replicas: 1
        strategy: Recreate
        initContainers:
          # Everything the image's own entrypoint does not: the deploy key, the
          # git identity, and the clone of the knowledge base. Same image, so
          # `ok` and `git` are both already on PATH.
          install:
            image: &app_image
              repository: ghcr.io/yvigara/open-knowledge
              tag: test-0.66.2@sha256:c0953469bf4229163f7fab854a800a48bed71505f276483765f7e05c8a4fac45
            # `sh`, not `bash`: the image is alpine and carries only BusyBox.
            # Naming a command also bypasses the image's ENTRYPOINT, which is
            # what we want here — that one starts the server.
            command: ["sh", "/run/config/install.sh"]
            env:
              # Not an OpenKnowledge setting — the image's own entrypoint reads
              # it to pick the project directory, and install.sh follows it.
              OK_HOME: &data_dir /opt/data
              # Deliberately outside the project: $HOME/.ssh holds the deploy
              # key, and full sync commits everything the knowledge base is not
              # ignoring. A key under /opt/data would be pushed to the remote.
              HOME: &home_dir /home/ok
              OK_GIT_REMOTE: git@github.com:yvigara/lifeos.git
              OK_GIT_BRANCH: main
              GIT_AUTHOR_NAME: open-knowledge
              GIT_AUTHOR_EMAIL: open-knowledge@${DOMAIN}
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: open-knowledge-deploy-key
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
        containers:
          app:
            image: *app_image
            # No command: the image's entrypoint runs `ok init` on an
            # uninitialized volume and then `ok start`. install.sh has already
            # initialized it, so in practice it goes straight to the server.
            #
            # OpenKnowledge resolves settings as CLI flags > environment >
            # project-local config > project config > user config > defaults.
            # The environment sits above every config file, so what is set here
            # cannot be adjusted anywhere else — right for what belongs to the
            # container, wrong for what belongs to the instance. PORT, OK_BIND
            # and OK_HOME are already baked into the image and correct as they
            # are, so they are inherited rather than restated; idle shutdown and
            # the sync mode live in the project-local config layer that
            # install.sh renders. Only the two exposure declarations, which the
            # image deliberately does not bake, are set here.
            env:
              TZ: ${TIMEZONE}
              # Git needs to find ~/.ssh and ~/.gitconfig during sync, and the
              # image sets no HOME of its own.
              HOME: *home_dir
              # Exposure consent interlock. The image leaves it unset on
              # purpose: a run without it refuses to boot and names the fix.
              OK_ALLOW_EXTERNAL: "1"
              # The canonical public origin. It is both the sole Host allowlist
              # entry and the origin the server builds its wss:// and preview
              # URLs from, so every caller — browsers through the Cloudflare
              # tunnel, and Hermes in-cluster — has to present this exact Host
              # or get a 403.
              OK_EXTERNAL_URL: https://ok.${DOMAIN}
            probes:
              # /healthz and /readyz are mounted above every admission gate
              # precisely so orchestrator probes — which arrive with an IP Host
              # header — are not refused.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &app_port 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *app_port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              startup:
                enabled: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    service:
      app:
        controller: open-knowledge
        ports:
          # The one listener, matching the image's baked PORT. Public browser
          # traffic (via Cloudflare Access) and Hermes' direct /mcp calls both
          # land here.
          http:
            port: *app_port
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - ok.${DOMAIN}
        parentRefs:
          - name: traefik-public
            namespace: network
            sectionName: websecure
        rules:
          # The editor, and nothing else worth splitting out. `/mcp` is served
          # on this listener too but is not published: the only consumer is
          # Hermes, in-cluster, and there is no public MCP edge for this app.
          # Authentication happens at the Cloudflare edge (Access), not in the
          # cluster — see the README.
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: http
    persistence:
      # The knowledge base itself: a live git repo the server watches, writes
      # and syncs. This is the image's OK_HOME and WORKDIR.
      data:
        existingClaim: open-knowledge
        globalMounts:
          - path: *data_dir
      # $HOME, kept off the project volume so the deploy key never lands inside
      # the synced tree. Nothing here needs to outlive the pod: install.sh
      # rewrites the key, known_hosts and the gitconfig on every start.
      home:
        type: emptyDir
        globalMounts:
          - path: *home_dir
      config:
        type: configMap
        name: open-knowledge-configmap
        defaultMode: 0555
        advancedMounts:
          open-knowledge:
            install:
              - path: /run/config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
