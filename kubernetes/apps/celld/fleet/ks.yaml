# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: celld
spec:
  targetNamespace: celld
  dependsOn:
    # Holds the fleet bucket: the deployments, the SQLite replicas, the
    # ownership records, the node leases and the peer-auth secret.
    - name: rustfs
      namespace: storage
  path: ./kubernetes/apps/celld/fleet/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  wait: false
