# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buzz
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: buzz
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The relay's own Nostr identity. Rotating it gives the relay a new
        # identity, so this one is generated once and never touched again.
        BUZZ_RELAY_PRIVATE_KEY: "{{ .BUZZ_RELAY_PRIVATE_KEY }}"
        BUZZ_GIT_HOOK_HMAC_SECRET: "{{ .BUZZ_GIT_HOOK_HMAC_SECRET }}"
        DATABASE_URL: "postgres://buzz:{{ .BUZZ_PG_PASSWORD }}@postgres-rw.database.svc:5432/buzz?sslmode=disable"
        REDIS_URL: "redis://dragonfly.database.svc:6379"
        BUZZ_S3_ACCESS_KEY: "{{ .BUZZ_S3_ACCESS_KEY }}"
        BUZZ_S3_SECRET_KEY: "{{ .BUZZ_S3_SECRET_KEY }}"
  data:
    - secretKey: BUZZ_RELAY_PRIVATE_KEY
      remoteRef:
        key: BUZZ_RELAY_PRIVATE_KEY
    - secretKey: BUZZ_GIT_HOOK_HMAC_SECRET
      remoteRef:
        key: BUZZ_GIT_HOOK_HMAC_SECRET
    - secretKey: BUZZ_PG_PASSWORD
      remoteRef:
        key: BUZZ_PG_PASSWORD
    - secretKey: BUZZ_S3_ACCESS_KEY
      remoteRef:
        key: BUZZ_S3_ACCESS_KEY
    - secretKey: BUZZ_S3_SECRET_KEY
      remoteRef:
        key: BUZZ_S3_SECRET_KEY
