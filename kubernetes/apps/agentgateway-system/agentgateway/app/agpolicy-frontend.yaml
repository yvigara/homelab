apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentgateway-proxy-frontend
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  frontend:
    http:
      # AI routes buffer the request body; default 2mb 413s long-context (1M token) prompts.
      maxBufferSize: 32Mi
