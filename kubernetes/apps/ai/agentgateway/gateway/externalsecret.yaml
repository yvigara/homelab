# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omlx
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: omlx-secret
    creationPolicy: Owner
    template:
      data:
        Authorization: "Bearer {{ .OMLX_KEY }}"
  data:
    - secretKey: OMLX_KEY
      remoteRef:
        key: OMLX_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omlx-client-keys
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: omlx-client-keys
    creationPolicy: Owner
    template:
      data:
        hermes: "{{ .HERMES_OMLX_KEY }}"
  data:
    - secretKey: HERMES_OMLX_KEY
      remoteRef:
        key: HERMES_OMLX_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ollama-cloud-apikey
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: ollama-cloud-apikey
    creationPolicy: Owner
    template:
      data:
        OLLAMA_API_KEY: "{{ .OLLAMA_API_KEY }}"
  data:
    - secretKey: OLLAMA_API_KEY
      remoteRef:
        key: OLLAMA_API_KEY
