# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.authorization.k8s.io/clusterrolebinding_v1.json
# `view` does not include Secrets. It covers Flux resources only where the Flux
# CRD roles are aggregated into `view`; if a tool reports forbidden, grant the
# missing resource here rather than reaching for cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-operator-mcp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: flux-operator-mcp
    namespace: flux-system
---
# The Flux Operator's own CRDs (FluxInstance, FluxReport, ResourceSet, ...) are not
# aggregated into `view`, so get_flux_instance reports "No Flux instance found"
# although `flux` exists. Read-only on that API group only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-operator-mcp-read
rules:
  - apiGroups: ["fluxcd.controlplane.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-operator-mcp-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-operator-mcp-read
subjects:
  - kind: ServiceAccount
    name: flux-operator-mcp
    namespace: flux-system
