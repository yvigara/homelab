apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp
spec:
  mcp:
    # `initialize` and the list calls fan out to every target. The default
    # (FailClosed) fails the whole session when any one target is down or
    # rejects a call, which is how a crashlooping beads server took every server
    # offline. FailOpen skips the failed target and serves the rest.
    failureMode: FailOpen
    targets:
      - name: searxng
        selector:
          services:
            matchLabels:
              app.kubernetes.io/instance: mcp-searxng
      - name: linkedin
        static:
          host: ${OLLAMA_SRV1_IP}
          port: 9080
          protocol: StreamableHTTP
      - name: memini
        static:
          host: memini.ai.svc.cluster.local
          port: 8080
          protocol: StreamableHTTP
          policies:
            auth:
              secretRef:
                name: memini
      # Obsidian vault via the Local REST API plugin on the Ollama host. Same
      # endpoint Hermes uses directly; the bearer comes from the obsidian-mcp
      # secret (externalsecret.yaml). Read and write: the vault is exposed as is.
      - name: obsidian
        static:
          host: ${OLLAMA_SRV1_IP}
          port: 27124
          protocol: StreamableHTTP
          policies:
            auth:
              secretRef:
                name: obsidian-mcp
      # Rendered Flux diffs for open PRs (read-only; config.mcp in the konflate
      # HelmRelease). The endpoint itself has no auth; this route's Access
      # policy is what protects it.
      - name: konflate
        static:
          host: konflate.flux-system.svc.cluster.local
          port: 8080
          protocol: StreamableHTTP
      # Radar runs with --mcp-read-only, which moves the endpoint to
      # /mcp-readonly and drops exec/helm/curl tools entirely.
      - name: radar
        static:
          host: radar.radar.svc.cluster.local
          port: 9280
          path: /mcp-readonly
          protocol: StreamableHTTP
      # Flux Operator MCP server, started with readonly: true.
      - name: flux
        static:
          host: flux-operator-mcp.flux-system.svc.cluster.local
          port: 9090
          protocol: StreamableHTTP
---
# No JWT policy on this route. Authentication for mcp.${DOMAIN} is Cloudflare Access
# with Managed OAuth, enforced at the edge and re-checked by cloudflared
# (kubernetes/core/network/cloudflare-tunnel). Access hands the client an opaque
# token and serves the discovery metadata itself, so agentgateway has nothing to
# validate or advertise. The signed Cf-Access-Jwt-Assertion header is forwarded to
# the targets. See ../README.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: mcp
          kind: AgentgatewayBackend
          group: agentgateway.dev
