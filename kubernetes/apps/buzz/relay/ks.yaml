# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: buzz
spec:
  targetNamespace: buzz
  dependsOn:
    # Owns the buzz database, role and role password secret.
    - name: cnpg-cluster
      namespace: database
    - name: dragonfly
      namespace: database
    - name: buzz-minio
      namespace: buzz
  path: ./kubernetes/apps/buzz/relay/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  wait: false
