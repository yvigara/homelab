# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: cloudflare-tunnel-secret
    template:
      data:
        TUNNEL_TOKEN: |-
          {{ toJson (dict "a" .CF_ACCOUNT_TAG "t" .CF_TUNNEL_ID "s" .CF_TUNNEL_SECRET) | b64enc }}
  data:
    - secretKey: CF_ACCOUNT_TAG
      remoteRef:
        key: CF_ACCOUNT_TAG
    - secretKey: CF_TUNNEL_ID
      remoteRef:
        key: CF_TUNNEL_ID
    - secretKey: CF_TUNNEL_SECRET
      remoteRef:
        key: CF_TUNNEL_SECRET
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  # The ingress rules are rendered here rather than in a ConfigMap so the Access
  # team name and the AUD tag of the mcp application come from Bitwarden. Neither is
  # a credential, but both are account-specific and the AUD changes if the Access
  # application is ever recreated.
  #
  # The mcp.${DOMAIN} rule has to stay above the wildcard: cloudflared takes the first
  # match. `access.required` makes cloudflared validate the Cf-Access-Jwt-Assertion
  # header itself, so a request that reaches the tunnel without passing the Access
  # application (deleted, wrong hostname, policy gone) is refused instead of served.
  target:
    name: cloudflare-tunnel-config
    template:
      data:
        config.yaml: |-
          ingress:
            - hostname: "mcp.${DOMAIN}"
              service: https://traefik.network.svc.cluster.local:443
              originRequest:
                http2Origin: true
                keepAliveTimeout: 3600s
                originServerName: tun-${CLUSTER_NAME}.${DOMAIN}
                tcpKeepAlive: 7200s
                matchSNItoHost: true
                noTLSVerify: true
                access:
                  required: true
                  teamName: "{{ .CF_ACCESS_TEAM_NAME }}"
                  audTag:
                    - "{{ .CF_ACCESS_MCP_AUD }}"
            - hostname: "*.${DOMAIN}"
              service: https://traefik.network.svc.cluster.local:443
              originRequest:
                http2Origin: true
                keepAliveTimeout: 3600s
                originServerName: tun-${CLUSTER_NAME}.${DOMAIN}
                tcpKeepAlive: 7200s
                matchSNItoHost: true
                noTLSVerify: true
            - hostname: "*.${CLUSTER_NAME}.${DOMAIN}"
              service: https://traefik.network.svc.cluster.local:443
              originRequest:
                http2Origin: true
                keepAliveTimeout: 3600s
                originServerName: tun-${CLUSTER_NAME}.${DOMAIN}
                tcpKeepAlive: 7200s
                matchSNItoHost: true
                noTLSVerify: true
            - hostname: "${REGION}.${ENVIRONMENT}.${DOMAIN}"
              service: https://traefik.network.svc.cluster.local:443
              originRequest:
                http2Origin: true
                keepAliveTimeout: 3600s
                originServerName: tun-${CLUSTER_NAME}.${DOMAIN}
                tcpKeepAlive: 7200s
                matchSNItoHost: true
                noTLSVerify: true
            - hostname: "*.${REGION}.${ENVIRONMENT}.${DOMAIN}"
              service: https://traefik.network.svc.cluster.local:443
              originRequest:
                http2Origin: true
                keepAliveTimeout: 3600s
                originServerName: tun-${CLUSTER_NAME}.${DOMAIN}
                tcpKeepAlive: 7200s
                matchSNItoHost: true
                noTLSVerify: true
            - service: http_status:404
  data:
    - secretKey: CF_ACCESS_TEAM_NAME
      remoteRef:
        key: CF_ACCESS_TEAM_NAME
    - secretKey: CF_ACCESS_MCP_AUD
      remoteRef:
        key: CF_ACCESS_MCP_AUD
