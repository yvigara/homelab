# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: lfm2.5-2.6b
spec:
  format: gguf
  quantization: Q4_K_M
  source: https://huggingface.co/LiquidAI/LFM2.5-2.6B-GGUF/resolve/main/LFM2.5-2.6B-Q4_K_M.gguf
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: lfm2.5-2.6b
spec:
  modelRef: lfm2.5-2.6b
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-b10680@sha256:db057ec90de0a423255a218b9612420993237ff33db68b3155dc3bba9b994a20
  replicas: 1
  podSecurityContext:
    # 102 = curlimages/curl curl_group GID; makes the /models emptyDir
    # writable by the model-downloader init container (we override the
    # chart's default fsGroup by supplying podSecurityContext).
    fsGroup: 102
    supplementalGroups:
      - 44
      - 992
  contextSize: 65536
  parallelSlots: 1
  batchSize: 8192
  uBatchSize: 4096
  resources:
    gpu: 0
    cpu: 100m
    memory: 8Gi
  extraArgs:
    - -t
    - "6"
    - -fa
    - "on"
    - --no-mmap
    - --temp
    - "0.1"
    - --top-k
    - "50"
    - --repeat-penalty
    - "1.1"
    - --alias
    - lfm2.5-2.6b
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 60
    liveness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 30
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 3
