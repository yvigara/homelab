# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: camofox
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: camofox-secret
    template:
      data:
        # Same value in both keys on purpose: ACCESS_KEY gates every route so the
        # REST API is not open to the whole cluster, API_KEY gates cookie import.
        # Hermes only ever sends one bearer token (its CAMOFOX_API_KEY), and the
        # server accepts the access key as a superkey for the API_KEY routes.
        CAMOFOX_ACCESS_KEY: "{{ .CAMOFOX_API_KEY }}"
        CAMOFOX_API_KEY: "{{ .CAMOFOX_API_KEY }}"
  data:
    - secretKey: CAMOFOX_API_KEY
      remoteRef:
        key: CAMOFOX_API_KEY
