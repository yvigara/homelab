apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                cp /run/config/config.yaml /opt/data/config.yaml
                chown 10000:10000 /opt/data/config.yaml
        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.7.1@sha256:b6c019227889e6675424a2b6223b2cafdd36bf7d1048d1ddd8e043b880d6cc0f
            args:
              - "gateway"
              - "run"
            env:
              TZ: ${TIMEZONE}
              API_SERVER_ENABLED: true
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_PORT: &app_port 8642
              HERMES_GID: "1000"
              HERMES_HOME: /opt/data
              HERMES_UID: "1000"
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_PUBLIC_URL: "https://hermes.int.${REGION}.${ENVIRONMENT}.${DOMAIN}"
              HERMES_DASHBOARD_OIDC_ISSUER: "https://dex.${DOMAIN}"
              HERMES_DASHBOARD_OIDC_CLIENT_ID: "hermes-dashboard"
              MEMINI_URL: http://memini.ai.svc.cluster.local:8080
              MEMINI_NAMESPACE: hermes
              WHATSAPP_ENABLED: true
              WHATSAPP_MODE: self-chat
              HOME: /opt/data
              TERM: xterm-256color
            envFrom:
              - secretRef:
                  name: hermes-secret
            ports:
              - containerPort: *app_port
                name: gateway
                protocol: TCP
              - containerPort: &dashboard_port 9119
                name: dashboard
                protocol: TCP
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
    service:
      app:
        controller: hermes
        ports:
          gateway:
            port: *app_port
          dashboard:
            port: *dashboard_port
    route:
      dashboard:
        hostnames:
          - "hermes.int.${REGION}.${ENVIRONMENT}.${DOMAIN}"
        parentRefs:
          - name: traefik-private
            namespace: network
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
    persistence:
      data:
        existingClaim: hermes
        globalMounts:
          - path: /opt/data
      config:
        type: configMap
        name: hermes-configmap
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/config.yaml
                subPath: config.yaml
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /run
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
