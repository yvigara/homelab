apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          init:
            image: &app_image
              repository: nousresearch/hermes-agent
              tag: v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
            env:
              HOME: /opt/data
              HERMES_HOME: /opt/data
              # renovate: datasource=github-releases depName=jdx/mise
              MISE_VERSION: v2026.9.1
              MISE_INSTALL_PATH: /opt/data/.local/bin/mise
              MISE_INSTALL_SKIP_IF_EXISTS: "1"
              MISE_YES: "1"
              GIT_COMMITTER_NAME: &committer_name yvigara
              GIT_COMMITTER_EMAIL: &committer_email 704600+yvigara@users.noreply.github.com
            envFrom:
              - secretRef:
                  name: hermes-github-app
              - secretRef:
                  name: hermes-signing-key
            command:
              - bash
              - /run/config/init.sh
        containers:
          app:
            image: *app_image
            args:
              - "gateway"
              - "run"
            # Process env outranks config.yaml and .env, so anything set here
            # cannot be overridden per agent. Per-agent settings live in that
            # profile's own .env - see externalsecret.yaml.
            env:
              TZ: ${TIMEZONE}
              HERMES_GID: "1000"
              HERMES_HOME: /opt/data
              HERMES_UID: "1000"
              # One dashboard backend serves every agent in this container.
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_PUBLIC_URL: "https://hermes.${DOMAIN}"
              HERMES_DASHBOARD_OIDC_ISSUER: "https://dex.${DOMAIN}"
              HERMES_DASHBOARD_OIDC_CLIENT_ID: "hermes-dashboard-public"
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: MEMINI_API_KEY
              SEARXNG_URL: http://searxng.ai.svc.cluster.local:8080
              # Anti-detection browser backend; the bearer token it
              # authenticates with comes from hermes-secret (CAMOFOX_API_KEY).
              CAMOFOX_URL: http://camofox.ai.svc.cluster.local:9377
              HOME: /opt/data
              TERM: xterm-256color
              # Author stays hermes[bot] (user.email in the gitconfig); GitHub
              # verifies SSH signatures against the committer, and only a user
              # account can own a signing key.
              GIT_COMMITTER_NAME: *committer_name
              GIT_COMMITTER_EMAIL: *committer_email
              PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/opt/data/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            envFrom:
              - configMapRef:
                  name: cluster-vars
              - secretRef:
                  name: hermes-secret
              - secretRef:
                  name: hermes-github-app
            ports:
              - containerPort: &app_port 8642
                name: gateway
                protocol: TCP
              - containerPort: &dashboard_port 9119
                name: dashboard
                protocol: TCP
            # Twelve supervised gateways: the default agent plus one per
            # profile. Memory tracks how many are handling a conversation at
            # once, not how many are running.
            resources:
              requests:
                cpu: 250m
                memory: 2Gi
              limits:
                memory: 8Gi
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.135.0@sha256:ccd326184d71efc5ebb94155eda7bb30153902342a35dbc8525450d81aa55012
            env:
              TZ: America/Edmonton
            args:
              - --auth
              - none
              - --disable-telemetry
              - --disable-update-check
              - --user-data-dir
              - /opt/data/.vscode
              - --extensions-dir
              - /opt/data/.vscode
              - --port
              - "12321"
              - /opt/data
            ports:
              - containerPort: &codeserverPort 12321
                name: codeserver
                protocol: TCP
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        controller: hermes
        ports:
          gateway:
            port: *app_port
          dashboard:
            port: *dashboard_port
          codeserver:
            port: *codeserverPort
    route:
      dashboard:
        hostnames:
          - "hermes.int.${REGION}.${ENVIRONMENT}.${DOMAIN}"
        parentRefs:
          - name: traefik-private
            namespace: network
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
      public-dashboard:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - "hermes.${DOMAIN}"
        parentRefs:
          - name: traefik-public
            namespace: network
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
      api:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - "hermes-api.${DOMAIN}"
        parentRefs:
          - name: traefik-public
            namespace: network
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: gateway
      codeserver:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - "hermes-code.${DOMAIN}"
        parentRefs:
          - name: traefik-public
            namespace: network
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: codeserver
    persistence:
      data:
        existingClaim: hermes
        globalMounts:
          - path: /opt/data
      config:
        type: configMap
        name: hermes-configmap
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/config.yaml
                subPath: config.yaml
              - path: /run/config/mise.toml
                subPath: mise.toml
              - path: /run/config/git-init.sh
                subPath: git-init.sh
              - path: /run/config/init.sh
                subPath: init.sh
              - path: /run/config/profiles-init.sh
                subPath: profiles-init.sh
      profile-amy:
        type: configMap
        name: hermes-profile-amy
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/profiles/amy
      profile-bender:
        type: configMap
        name: hermes-profile-bender
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/profiles/bender
      profile-conrad:
        type: configMap
        name: hermes-profile-conrad
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/profiles/conrad
      profile-farnsworth:
        type: configMap
        name: hermes-profile-farnsworth
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/profiles/farnsworth
      profile-fry:
        type: configMap
        name: hermes-profile-fry
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/profiles/fry
      profile-leela:
        type: configMap
        name: hermes-profile-leela
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/profiles/leela
      profile-mom:
        type: configMap
        name: hermes-profile-mom
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/profiles/mom
      profile-morbo:
        type: configMap
        name: hermes-profile-morbo
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/profiles/morbo
      profile-nibbler:
        type: configMap
        name: hermes-profile-nibbler
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/profiles/nibbler
      profile-nixon:
        type: configMap
        name: hermes-profile-nixon
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/profiles/nixon
      profile-wernstrom:
        type: configMap
        name: hermes-profile-wernstrom
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/profiles/wernstrom
      profiles-env:
        type: secret
        name: hermes-profile-env
        defaultMode: 0400
        advancedMounts:
          hermes:
            init:
              - path: /run/secrets/hermes-profiles
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /run
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
