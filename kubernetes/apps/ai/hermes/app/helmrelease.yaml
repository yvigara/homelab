apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          init:
            image: &app_image
              repository: nousresearch/hermes-agent
              tag: v2026.8.19@sha256:3811ed13da874fba2ac99b6d492db9a203d34cb6dccf90d886948c00d0ccec09
            env:
              HOME: /opt/data
              # renovate: datasource=github-releases depName=jdx/mise
              MISE_VERSION: v2026.8.14
              MISE_INSTALL_PATH: /opt/data/.local/bin/mise
              MISE_INSTALL_SKIP_IF_EXISTS: "1"
              MISE_YES: "1"
              GIT_COMMITTER_NAME: &committer_name yvigara
              GIT_COMMITTER_EMAIL: &committer_email 704600+yvigara@users.noreply.github.com
            envFrom:
              - secretRef:
                  name: hermes-github-app
              - secretRef:
                  name: hermes-signing-key
            command:
              - bash
              - /run/config/init.sh
        containers:
          app:
            image: *app_image
            args:
              - "gateway"
              - "run"
            # Inherited by every process in this container, and Hermes resolves
            # process env above both config.yaml and .env - so what is set here
            # is not merely shared, it cannot be overridden further down. Only
            # values that belong to the container as a whole belong here.
            # Settings that belong to the agent itself - its gateway port, the
            # bot tokens it claims, the memory namespace it writes to - live in
            # its own .env, rendered by the hermes-profile-default
            # ExternalSecret.
            env:
              TZ: ${TIMEZONE}
              HERMES_GID: "1000"
              HERMES_HOME: /opt/data
              HERMES_UID: "1000"
              # Machine-level rather than agent-level: one dashboard backend
              # serves every agent co-located in this container.
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_PUBLIC_URL: "https://hermes.${DOMAIN}"
              HERMES_DASHBOARD_OIDC_ISSUER: "https://dex.${DOMAIN}"
              HERMES_DASHBOARD_OIDC_CLIENT_ID: "hermes-dashboard-public"
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: MEMINI_API_KEY
              SEARXNG_URL: http://searxng.ai.svc.cluster.local:8080
              # Anti-detection browser backend; the bearer token it
              # authenticates with comes from hermes-secret (CAMOFOX_API_KEY).
              CAMOFOX_URL: http://camofox.ai.svc.cluster.local:9377
              HOME: /opt/data
              TERM: xterm-256color
              # Author stays hermes[bot] (user.email in the gitconfig); GitHub
              # verifies SSH signatures against the committer, and only a user
              # account can own a signing key.
              GIT_COMMITTER_NAME: *committer_name
              GIT_COMMITTER_EMAIL: *committer_email
              PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/opt/data/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            envFrom:
              - configMapRef:
                  name: cluster-vars
              - secretRef:
                  name: hermes-secret
              - secretRef:
                  name: hermes-github-app
            ports:
              - containerPort: &app_port 8642
                name: gateway
                protocol: TCP
              - containerPort: &dashboard_port 9119
                name: dashboard
                protocol: TCP
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.135.0@sha256:ccd326184d71efc5ebb94155eda7bb30153902342a35dbc8525450d81aa55012
            env:
              TZ: America/Edmonton
            args:
              - --auth
              - none
              - --disable-telemetry
              - --disable-update-check
              - --user-data-dir
              - /opt/data/.vscode
              - --extensions-dir
              - /opt/data/.vscode
              - --port
              - "12321"
              - /opt/data
            ports:
              - containerPort: &codeserverPort 12321
                name: codeserver
                protocol: TCP
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        controller: hermes
        ports:
          gateway:
            port: *app_port
          dashboard:
            port: *dashboard_port
          codeserver:
            port: *codeserverPort
    route:
      dashboard:
        hostnames:
          - "hermes.int.${REGION}.${ENVIRONMENT}.${DOMAIN}"
        parentRefs:
          - name: traefik-private
            namespace: network
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
      public-dashboard:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - "hermes.${DOMAIN}"
        parentRefs:
          - name: traefik-public
            namespace: network
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
      api:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - "hermes-api.${DOMAIN}"
        parentRefs:
          - name: traefik-public
            namespace: network
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: gateway
      codeserver:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - "hermes-code.${DOMAIN}"
        parentRefs:
          - name: traefik-public
            namespace: network
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: codeserver
    persistence:
      data:
        existingClaim: hermes
        globalMounts:
          - path: /opt/data
      config:
        type: configMap
        name: hermes-configmap
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/config.yaml
                subPath: config.yaml
              - path: /run/config/mise.toml
                subPath: mise.toml
              - path: /run/config/git-init.sh
                subPath: git-init.sh
              - path: /run/config/init.sh
                subPath: init.sh
      profile-default:
        type: secret
        name: hermes-profile-default
        defaultMode: 0400
        advancedMounts:
          hermes:
            init:
              - path: /run/secrets/hermes-profile-default
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /run
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
