# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kratos
spec:
  interval: 1h
  chart:
    spec:
      chart: kratos
      version: 0.62.1
      sourceRef:
        kind: HelmRepository
        name: ory
        namespace: flux-system
      interval: 12h
  values:
    fullnameOverride: kratos

    kratos:
      automigration:
        enabled: true
        type: job

      # identity schema mounted at /etc/config by the chart
      identitySchemas:
        identity.default.schema.json: |
          {
            "$id": "https://schemas.${DOMAIN}/identity.default.schema.json",
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "Person",
            "type": "object",
            "properties": {
              "traits": {
                "type": "object",
                "properties": {
                  "email": {
                    "type": "string",
                    "format": "email",
                    "title": "E-Mail"
                  },
                  "username": {
                    "type": "string",
                    "title": "GitHub username"
                  }
                },
                "required": ["username"],
                "additionalProperties": false
              }
            }
          }

      config:
        serve:
          public:
            base_url: https://kratos.${DOMAIN}/
            cors:
              enabled: true
              allowed_origins:
                - https://login.${DOMAIN}
              allowed_methods: [GET, POST, PUT, DELETE]
              allowed_headers: [Authorization, Content-Type, Cookie]
              allow_credentials: true
          admin:
            base_url: http://kratos-admin.auth.svc.cluster.local:80/

        # Kratos acts as the login/consent provider for Hydra
        oauth2_provider:
          url: http://hydra-admin.auth.svc.cluster.local:4445

        selfservice:
          default_browser_return_url: https://login.${DOMAIN}/
          allowed_return_urls:
            - https://login.${DOMAIN}
            - https://mcp.${DOMAIN}
            - https://hermes.int.${REGION}.${ENVIRONMENT}.${DOMAIN}
          flows:
            error:
              ui_url: https://login.${DOMAIN}/error
            login:
              ui_url: https://login.${DOMAIN}/login
              lifespan: 10m
            registration:
              ui_url: https://login.${DOMAIN}/registration
              after:
                oidc:
                  hooks:
                    # auto-create a session after first social sign-in
                    - hook: session
            settings:
              ui_url: https://login.${DOMAIN}/settings
            logout:
              after:
                default_browser_return_url: https://login.${DOMAIN}/login
          methods:
            # federation only - no local passwords / recovery / verification
            password:
              enabled: false
            oidc:
              enabled: true
              config:
                providers:
                  - id: github
                    provider: github
                    # creds substituted by Flux from the auth-namespace cluster-secrets
                    # (../cluster-secrets.yaml, picked up by the inherited substituteFrom) —
                    # mirrors how Dex is wired in this repo
                    client_id: ${DEX_GITHUB_CLIENT_ID}
                    client_secret: ${DEX_GITHUB_CLIENT_SECRET}
                    mapper_url: "base64:"
                    scope:
                      - read:org
                      - user:email

        identity:
          default_schema_id: default
          schemas:
            - id: default
              url: file:///etc/config/identity.default.schema.json

        # Kratos requires a courier config; no email flows are enabled so it is never used
        courier:
          smtp:
            connection_uri: smtps://unused:unused@localhost:1025/?skip_ssl_verify=true

        log:
          level: info
          format: json

    # DSN + system/cookie/cipher secrets come from our ExternalSecret
    secret:
      enabled: false
      nameOverride: kratos-secret

    deployment:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

    # ---------------------------------------------------------------------------
    # celest-io ORG GATE — DEFERRED (decision: revisit at the Phase 2 authz layer).
    # Dex restricted logins to the `celest-io` org natively; Kratos cannot express
    # this in config alone (GitHub OIDC claims omit org membership; Kratos web_hook
    # URLs aren't templated). The `read:org` scope above already collects the grant
    # a future membership-check web_hook would need. Until enforced (here or at the
    # AgentGateway/Hermes authz layer), any GitHub user can sign in — so do NOT
    # point Hermes at Ory / remove Dex until this is resolved. See auth/README.md.
    # ---------------------------------------------------------------------------
