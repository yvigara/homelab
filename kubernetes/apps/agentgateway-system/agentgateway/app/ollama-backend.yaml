apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: ollama
  namespace: agentgateway-system
spec:
  ai:
    provider:
      host: "${MAC_MINI_IP}"
      port: 11434
      custom:
        formats:
          - type: Completions
          - type: Responses
          - type: Embeddings
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      sectionName: llm
  rules:
    - backendRefs:
        - name: ollama
          kind: AgentgatewayBackend
          group: agentgateway.dev
