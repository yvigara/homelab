# The project-local layer of OpenKnowledge's config, installed to
# <project>/.ok/local/config.yml by install.sh on every pod start.
#
# These are project-local-scope settings: per-machine, gitignored inside the
# knowledge base, and — unlike the pod's environment — sitting BELOW the env
# layer in OpenKnowledge's precedence chain. Setting them here rather than as
# OK_* variables is what leaves them adjustable at all; see README.md.
#
# Rewritten from this file on every start, so what is in git wins over what is
# on the volume. Anything the editor writes into the same file (the Settings
# pane keeps semantic search, hidden-file and link-preview toggles here) is lost
# on the next restart unless it is added below as well.
server:
  # The idle timer only counts editor WebSocket clients, so a server busy
  # serving MCP calls looks idle. Left on, it would tear itself down mid-session
  # and hand Kubernetes a pod that exits for no visible reason.
  idleShutdown: "off"
autoSync:
  # Fetch the remote, commit edits made here, push them back. Full rather than
  # follow because this server is the writer: the editor and Hermes both author
  # into the knowledge base, and those commits have to reach the remote.
  mode: full
