# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: konflate-webhook
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  hostnames:
    - "konflate-${CLUSTER_NAME}-wh.${DOMAIN}"
  parentRefs:
    - name: traefik-public
      namespace: network
      sectionName: websecure
  rules:
    # Only GitHub's delivery endpoint; every other path 404s at the gateway.
    - matches:
        - path:
            type: Exact
            value: /hooks
          method: POST
      backendRefs:
        - name: konflate
          port: 8080
