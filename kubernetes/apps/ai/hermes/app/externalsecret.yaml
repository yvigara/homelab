# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: hermes-secret
    template:
      data:
        API_SERVER_KEY: "{{ .HERMES_API_SERVER_KEY }}"
        WHATSAPP_ALLOWED_USERS: "{{ .WHATSAPP_ALLOWED_USERS }}"
        SLACK_BOT_TOKEN: "{{ .SLACK_BOT_TOKEN }}"
        SLACK_APP_TOKEN: "{{ .SLACK_APP_TOKEN }}"
        SLACK_ALLOWED_CHANNELS: "{{ .SLACK_ALLOWED_CHANNELS }}"
        SLACK_ALLOWED_USERS: "{{ .SLACK_ALLOWED_USERS }}"
        SLACK_HOME_CHANNEL: "{{ .SLACK_HOME_CHANNEL }}"
        SLACK_HOME_CHANNEL_NAME: "{{ .SLACK_HOME_CHANNEL_NAME }}"
        CLAUDE_CODE_OAUTH_TOKEN: "{{ .CLAUDE_CODE_OAUTH_TOKEN }}"
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        MEETING_NOTES_MCP_URL: "{{ .MEETING_NOTES_MCP_URL }}"
        OBSIDIAN_AUTH_HEADER: "Bearer {{ .OBSIDIAN_API_KEY }}"
        X_MCP_AUTH_HEADER: "Bearer {{ .X_MCP_BEARER_TOKEN }}"
        X_MCP_CLIENT_ID: "{{ .X_MCP_CLIENT_ID }}"
        X_MCP_CLIENT_SECRET: "{{ .X_MCP_CLIENT_SECRET }}"
        HERMES_OMLX_KEY: "{{ .HERMES_OMLX_KEY }}"
        # The agent's own Nostr identity on the Buzz relay (nsec or 64 hex).
        # Its pubkey has to be a relay member - see kubernetes/apps/buzz/README.md.
        BUZZ_PRIVATE_KEY: "{{ .HERMES_BUZZ_PRIVATE_KEY }}"
  data:
    - secretKey: WHATSAPP_ALLOWED_USERS
      remoteRef:
        key: WHATSAPP_ALLOWED_USERS
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: SLACK_BOT_TOKEN
    - secretKey: SLACK_APP_TOKEN
      remoteRef:
        key: SLACK_APP_TOKEN
    - secretKey: SLACK_ALLOWED_CHANNELS
      remoteRef:
        key: SLACK_ALLOWED_CHANNELS
    - secretKey: SLACK_ALLOWED_USERS
      remoteRef:
        key: SLACK_ALLOWED_USERS
    - secretKey: SLACK_HOME_CHANNEL
      remoteRef:
        key: SLACK_HOME_CHANNEL
    - secretKey: SLACK_HOME_CHANNEL_NAME
      remoteRef:
        key: SLACK_HOME_CHANNEL_NAME
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: CLAUDE_CODE_OAUTH_TOKEN
    - secretKey: HERMES_API_SERVER_KEY
      remoteRef:
        key: HERMES_API_SERVER_KEY
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: MEMINI_API_KEY
    - secretKey: MEETING_NOTES_MCP_URL
      remoteRef:
        key: MEETING_NOTES_MCP_URL
    - secretKey: OBSIDIAN_API_KEY
      remoteRef:
        key: OBSIDIAN_API_KEY
    - secretKey: X_MCP_BEARER_TOKEN
      remoteRef:
        key: X_MCP_BEARER_TOKEN
    - secretKey: X_MCP_CLIENT_ID
      remoteRef:
        key: X_MCP_CLIENT_ID
    - secretKey: X_MCP_CLIENT_SECRET
      remoteRef:
        key: X_MCP_CLIENT_SECRET
    - secretKey: HERMES_OMLX_KEY
      remoteRef:
        key: HERMES_OMLX_KEY
    - secretKey: HERMES_BUZZ_PRIVATE_KEY
      remoteRef:
        key: HERMES_BUZZ_PRIVATE_KEY
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-github-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: hermes-github-app
    template:
      data:
        # Git credential username and commit identity. Any value authenticates —
        # the installation token is the password — so keep it aligned with the
        # App's bot login for readable commit authorship.
        GH_APP_USERNAME: "hermes[bot]"
        GH_APP_ID: "{{ .GH_APP_ID }}"
        GH_APP_CLIENT_ID: "{{ .GH_APP_CLIENT_ID }}"
        GH_APP_INSTALLATION_ID: "{{ .GH_APP_INSTALLATION_ID }}"
        GH_APP_PRIVATE_KEY: "{{ .GH_APP_PRIVATE_KEY }}"
  data:
    - secretKey: GH_APP_ID
      remoteRef:
        key: HERMES_GH_APP_ID
    - secretKey: GH_APP_CLIENT_ID
      remoteRef:
        key: HERMES_GH_APP_CLIENT_ID
    - secretKey: GH_APP_INSTALLATION_ID
      remoteRef:
        key: HERMES_GH_APP_INSTALLATION_ID
    - secretKey: GH_APP_PRIVATE_KEY
      remoteRef:
        key: HERMES_GH_APP_PRIVATE_KEY
