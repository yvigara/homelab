apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crds
  namespace: flux-system
spec:
  interval: 30m
  dependsOn:
    - name: repos
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/core/crds
  prune: true
  retryInterval: 2m
  wait: true
