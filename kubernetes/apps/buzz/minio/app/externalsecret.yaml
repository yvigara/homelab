# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: minio
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Same credentials the relay dials the bucket with, see the buzz
        # ExternalSecret. MinIO refuses a root user shorter than 3 characters
        # or a root password shorter than 8.
        MINIO_ROOT_USER: "{{ .BUZZ_S3_ACCESS_KEY }}"
        MINIO_ROOT_PASSWORD: "{{ .BUZZ_S3_SECRET_KEY }}"
  data:
    - secretKey: BUZZ_S3_ACCESS_KEY
      remoteRef:
        key: BUZZ_S3_ACCESS_KEY
    - secretKey: BUZZ_S3_SECRET_KEY
      remoteRef:
        key: BUZZ_S3_SECRET_KEY
