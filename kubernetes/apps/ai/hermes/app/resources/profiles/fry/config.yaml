# Fry - writer.
#
# Voice-bound. The writing procedure is the `yann-article-writer` skill, which
# this profile wraps rather than restates: the skill owns the interview, the
# voice profile and the drafting rules. Install it into
# /opt/data/profiles/fry/skills/ - see ../../../README.md.
#
# Public-content profile, so a remote model is allowed here.
model:
  default: deepseek-v4-flash:cloud
  provider: custom:k8s-ollamacloud
custom_providers:
  - name: k8s-ollamacloud
    base_url: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/ollama-cloud
    api_key: "${HERMES_OMLX_KEY}"
    default_model: deepseek-v4-flash:cloud
  - name: k8s-omlx
    base_url: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/omlx
    api_key: "${HERMES_OMLX_KEY}"
    default_model: Qwen3.5-9B-MLX-4bit
    models:
      Qwen3.5-9B-MLX-4bit:
        context_length: 77824
      gemma-4-e4b-it-qat-OptiQ-4bit:
        context_length: 110592
fallback_providers:
  - provider: custom:k8s-omlx
    model: Qwen3.5-9B-MLX-4bit
# Auxiliary work stays local whatever the main model is: compression and
# titling see the whole conversation, so they are the widest exposure a
# profile has.
auxiliary:
  compression:
    provider: custom:k8s-omlx
    model: gemma-4-e4b-it-qat-OptiQ-4bit
  session_search:
    provider: custom:k8s-omlx
    model: Qwen3.5-9B-MLX-4bit
  title_generation:
    provider: custom:k8s-omlx
    model: Qwen3.5-9B-MLX-4bit
toolsets:
  - hermes-cli
platform_toolsets:
  cli:
    - clarify
    - file
    - memory
    - session_search
    - skills
    - todo
    - web
agent:
  max_turns: 120
  reasoning_effort: high
  tool_use_enforcement: auto
  disabled_toolsets:
    - homeassistant
    - spotify
    - computer_use
    - browser
    - tts
    - stt
    - cronjob
    - delegation
terminal:
  backend: local
  cwd: /opt/data/profiles/fry/workspace
  timeout: 180
  persistent_shell: true
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
memory:
  memory_enabled: true
  user_profile_enabled: false
  write_approval: false
  provider: memini
  flush_min_turns: 6
plugins:
  enabled:
    - memini
web:
  search_backend: searxng
security:
  allow_private_urls: false
  redact_secrets: true
privacy:
  redact_pii: true
approvals:
  mode: smart
  timeout: 60
  cron_mode: deny
mcp_servers:
  obsidian:
    url: http://${OLLAMA_SRV1_IP}:27124/mcp
    headers:
      Authorization: ${OBSIDIAN_AUTH_HEADER}
# No gateway platform. This profile is reached through the dashboard's
# profile switcher, `hermes -p fry chat`, and the vault.
gateway:
  platforms: {}
