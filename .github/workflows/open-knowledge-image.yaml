name: open-knowledge image

on:
  push:
    branches: [main]
    paths:
      - images/open-knowledge/**
      - .github/workflows/open-knowledge-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/open-knowledge

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          version=$(sed -n 's/^ARG OK_VERSION=//p' images/open-knowledge/Dockerfile)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build amd64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/open-knowledge
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:smoke
      - name: Smoke - version is pinned and first boot serves
        run: |
          set -euo pipefail
          installed="$(docker run --rm --entrypoint ok "$IMAGE:smoke" --version | head -n 1 | tr -d '[:space:]')"
          [ "${installed#v}" = "${{ steps.meta.outputs.version }}" ] || { echo "::error::image has ${installed}" >&2; exit 1; }
          trap 'docker logs ok-smoke 2>&1 | tail -n 50 || true; docker rm -f ok-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name ok-smoke -e OK_ALLOW_EXTERNAL=1 -p 127.0.0.1:8080:8080 "$IMAGE:smoke"
          for i in $(seq 1 120); do
            [ "$(docker inspect -f '{{.State.Running}}' ok-smoke)" = true ] || { echo "::error::container exited" >&2; exit 1; }
            curl -fsS --max-time 3 http://127.0.0.1:8080/healthz >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::/healthz never answered" >&2
          exit 1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/open-knowledge
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}-${{ github.sha }}
      - run: echo "digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
