apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
  namespace: ai
spec:
  hostnames:
    - "hermes.int.${REGION}.${ENVIRONMENT}.${DOMAIN}"
  parentRefs:
    - name: traefik-private
      namespace: network
      sectionName: websecure
  rules:
    - backendRefs:
        - name: hermes
          port: 9119
