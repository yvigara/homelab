# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./signingkey.yaml
  - ./pvc.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: hermes-configmap
    files:
      - config.yaml=./resources/config.yaml
      - mise.toml=./resources/mise.toml
      - init.sh=./resources/init.sh
      - git-init.sh=./resources/git-init.sh
      - profiles-init.sh=./resources/profiles-init.sh
  # Versioned home for the config-drift tripwire. The pod runs these from
  # /opt/data/scripts/drift (on the volume, and the cron job points there), but the
  # AUTHORITATIVE copy lives here so the check itself is reviewable and cannot be
  # lost with the volume. Keep the two in sync when changing them.
  - name: hermes-drift-scripts
    files:
      - config-drift.py=./resources/drift/config-drift.py
      - config-drift-watch.py=./resources/drift/config-drift-watch.py
      - config-drift-check.sh=./resources/drift/config-drift-check.sh
  # One ConfigMap per profile, mounted as a whole directory. SOUL.md is managed
  # outside this repository; the secret half of each .env comes from the
  # hermes-profile-env Secret.
  - name: hermes-profile-amy
    files:
      - config.yaml=./resources/profiles/amy/config.yaml
      - profile.env=./resources/profiles/amy/profile.env
  - name: hermes-profile-bender
    files:
      - config.yaml=./resources/profiles/bender/config.yaml
      - profile.env=./resources/profiles/bender/profile.env
  - name: hermes-profile-conrad
    files:
      - config.yaml=./resources/profiles/conrad/config.yaml
      - profile.env=./resources/profiles/conrad/profile.env
  - name: hermes-profile-fry
    files:
      - config.yaml=./resources/profiles/fry/config.yaml
      - profile.env=./resources/profiles/fry/profile.env
  - name: hermes-profile-leela
    files:
      - config.yaml=./resources/profiles/leela/config.yaml
      - profile.env=./resources/profiles/leela/profile.env
  - name: hermes-profile-mom
    files:
      - config.yaml=./resources/profiles/mom/config.yaml
      - profile.env=./resources/profiles/mom/profile.env
  - name: hermes-profile-morbo
    files:
      - config.yaml=./resources/profiles/morbo/config.yaml
      - profile.env=./resources/profiles/morbo/profile.env
  - name: hermes-profile-nibbler
    files:
      - config.yaml=./resources/profiles/nibbler/config.yaml
      - profile.env=./resources/profiles/nibbler/profile.env
  - name: hermes-profile-nixon
    files:
      - config.yaml=./resources/profiles/nixon/config.yaml
      - profile.env=./resources/profiles/nixon/profile.env
  - name: hermes-profile-wernstrom
    files:
      - config.yaml=./resources/profiles/wernstrom/config.yaml
      - profile.env=./resources/profiles/wernstrom/profile.env
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
