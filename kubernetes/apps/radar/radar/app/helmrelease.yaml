# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
spec:
  interval: 1h
  chart:
    spec:
      chart: radar
      version: 1.20.2
      sourceRef:
        kind: HelmRepository
        name: skyhook
        namespace: flux-system
      interval: 10m
  values:
    # Sign-in goes through Dex, same public-client + PKCE pattern as the hermes
    # dashboard: no client secret. Radar then impersonates the signed-in user
    # (email claim) against the API server, so access comes from the RBAC in
    # rbac.yaml, not from Radar's own ServiceAccount.
    auth:
      mode: oidc
      oidc:
        issuerURL: "https://dex.${DOMAIN}"
        clientID: radar-public
        redirectURL: "https://radar.${DOMAIN}/auth/callback"
        enablePKCE: true
    httpRoute:
      enabled: true
      annotations:
        external-dns.kubernetes.io/cloudflare-proxied: "true"
      hostnames:
        - "radar.${DOMAIN}"
      parentRefs:
        - name: traefik-public
          namespace: network
          sectionName: websecure
