# Public exposure of the MCP endpoint: Cloudflare tunnel -> traefik-public ->
# agentgateway-proxy `mcp` listener (:8080). Mirrors the flux github-webhook route.
# No tunnel/DNS change needed — the *.${DOMAIN} wildcard already targets the tunnel.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-public
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  hostnames:
    - "mcp.${DOMAIN}"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-public
      namespace: network
      sectionName: websecure
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: agentgateway-proxy
          namespace: agentgateway-system
          port: 8080
---
# Allow the ai-namespace HTTPRoute above to reference the agentgateway-proxy Service
# in the agentgateway-system namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: ai-mcp-to-agentgateway-proxy
  namespace: agentgateway-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: ai
  to:
    - group: ""
      kind: Service
      name: agentgateway-proxy
