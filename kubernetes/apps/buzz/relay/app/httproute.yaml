# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Written out here rather than through the chart's `httproute` values: that
# template renders no annotations, and every public route in this cluster needs
# the cloudflare-proxied one for external-dns to point the record at the tunnel.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: buzz
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  hostnames:
    - "buzz.${DOMAIN}"
  parentRefs:
    - name: traefik-public
      namespace: network
      sectionName: websecure
  rules:
    # The NIP-AB pairing handshake is served by the chart's standalone
    # buzz-pair-relay sidecar, which has no auth, no persistence and a 120s
    # session TTL. It ignores the request path, so no rewrite is needed; the
    # longer prefix wins over the catch-all rule below.
    - matches:
        - path:
            type: PathPrefix
            value: /pair
      backendRefs:
        - kind: Service
          name: buzz-pairing
          port: 5000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: buzz
          port: 3000
