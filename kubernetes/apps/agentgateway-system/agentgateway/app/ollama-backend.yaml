apiVersion: v1
kind: Service
metadata:
  name: ollama-mac-mini
  namespace: agentgateway-system
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama-mac-mini
  namespace: agentgateway-system
subsets:
  - addresses:
      - ip: ${MAC_MINI_IP}
    ports:
      - port: 11434
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      sectionName: llm
  rules:
    - backendRefs:
        - name: ollama-mac-mini
          port: 11434
