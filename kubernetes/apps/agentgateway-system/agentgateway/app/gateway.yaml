apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      name: agentgateway-config
      group: agentgateway.dev
      kind: AgentgatewayParameters
  listeners:
    - protocol: HTTP
      port: 80
      name: http
      allowedRoutes:
        namespaces:
          from: All
    # Dedicated MCP listener. TLS is terminated upstream (Cloudflare edge + Traefik);
    # this stays plain HTTP internally. Kept separate from the Ollama `http` listener
    # so the public MCP route can never reach Ollama.
    - protocol: HTTP
      port: 8080
      name: mcp
      allowedRoutes:
        namespaces:
          from: All
