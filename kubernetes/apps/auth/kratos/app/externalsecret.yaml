# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Secret consumed by the Kratos chart (secret.nameOverride: kratos-secret,
# secret.enabled: false) -> keys dsn, secretsDefault, secretsCookie, secretsCipher.
#
# Required Bitwarden Secrets Manager keys:
#   ORY_KRATOS_DB_PASSWORD        - must match the CNPG kratos owner password
#   ORY_KRATOS_SECRETS_DEFAULT    - random >= 32 chars
#   ORY_KRATOS_SECRETS_COOKIE     - random >= 32 chars
#   ORY_KRATOS_SECRETS_CIPHER     - random EXACTLY 32 chars (AES-256)
#   DEX_GITHUB_CLIENT_ID          - existing GitHub OAuth App client id (reused)
#   DEX_GITHUB_CLIENT_SECRET      - existing GitHub OAuth App client secret (reused)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kratos
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: kratos-secret
    template:
      data:
        dsn: "postgres://kratos:{{ .ORY_KRATOS_DB_PASSWORD }}@kratos-postgres-rw.auth.svc.cluster.local:5432/kratos?sslmode=require"
        secretsDefault: "{{ .ORY_KRATOS_SECRETS_DEFAULT }}"
        secretsCookie: "{{ .ORY_KRATOS_SECRETS_COOKIE }}"
        secretsCipher: "{{ .ORY_KRATOS_SECRETS_CIPHER }}"
  data:
    - secretKey: ORY_KRATOS_DB_PASSWORD
      remoteRef: { key: ORY_KRATOS_DB_PASSWORD }
    - secretKey: ORY_KRATOS_SECRETS_DEFAULT
      remoteRef: { key: ORY_KRATOS_SECRETS_DEFAULT }
    - secretKey: ORY_KRATOS_SECRETS_COOKIE
      remoteRef: { key: ORY_KRATOS_SECRETS_COOKIE }
    - secretKey: ORY_KRATOS_SECRETS_CIPHER
      remoteRef: { key: ORY_KRATOS_SECRETS_CIPHER }
