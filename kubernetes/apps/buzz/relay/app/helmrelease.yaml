# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name buzz
spec:
  chartRef:
    kind: OCIRepository
    name: *name
  interval: 1h
  values:
    # Public WebSocket URL. Also drives NIP-42 auth challenges and, through the
    # chart, BUZZ_MEDIA_BASE_URL (https://<host>/media).
    relayUrl: wss://buzz.${DOMAIN}
    ownerPubkey: "${BUZZ_OWNER_PUBKEY}"
    # A relay's git state and media live in Postgres and the object store, but
    # huddle audio has no SFU yet and only works on a single pod.
    replicaCount: 1
    podDisruptionBudget:
      enabled: false
    # The only GitOps-safe secret path: the chart's own randAlphaNum autogen
    # regenerates on every server-side render.
    secrets:
      existingSecret: *name
    relay:
      requireAuthToken: true
      requireRelayMembership: true
      allowNipOaAuth: true
      corsOrigins:
        - https://buzz.${DOMAIN}
      extraEnv:
        - name: RUST_LOG
          value: buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    # Postgres, Redis and S3 are all external to the chart: DATABASE_URL and
    # REDIS_URL come from the buzz Secret, the bucket from RustFS in the
    # storage namespace.
    s3:
      endpoint: https://s3.int.${REGION}.${ENVIRONMENT}.${DOMAIN}
      bucket: buzz-media
    # The relay's startup object-store conformance probe is fatal and does not
    # create the bucket itself, so create it before the relay's first probe
    # rather than crash-looping until it appears. rc is RustFS's own S3 client,
    # with the same alias/mb surface mc had.
    extraInitContainers:
      - name: create-bucket
        image: docker.io/rustfs/rc:v0.1.31@sha256:f3dc331f76b14a852a1dc0bffc80509cc41424eaa9ea0306d9584edc211dcad6
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
        env:
          - name: RC_CONFIG_DIR
            value: /tmp/.rc
          - name: S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: *name
                key: BUZZ_S3_ACCESS_KEY
          - name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: *name
                key: BUZZ_S3_SECRET_KEY
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            until rc alias set rustfs https://s3.int.${REGION}.${ENVIRONMENT}.${DOMAIN} "$S3_ACCESS_KEY" "$S3_SECRET_KEY" >/dev/null 2>&1; do
              echo "waiting for rustfs..."
              sleep 2
            done
            rc mb --ignore-existing rustfs/buzz-media
            echo "bucket buzz-media ready"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
    # Scratch space for the ephemeral repos hydrated per git request; the
    # durable copy is in the object store.
    persistence:
      git:
        enabled: true
        accessMode: ReadWriteOnce
        storageClass: openebs-hostpath
        size: 10Gi
    migrate:
      autoMigrate: true
      preUpgradeJob:
        enabled: true
    # The public route lives in httproute.yaml — the chart's own httproute
    # template cannot carry the external-dns annotation it needs.
    serviceMonitor:
      enabled: true
