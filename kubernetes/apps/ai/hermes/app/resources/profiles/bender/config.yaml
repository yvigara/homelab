# Bender - forge, dispatches into Claude Code.
model:
  default: deepseek-v4-flash:cloud
  provider: custom:k8s-ollamacloud
providers:
  k8s-ollamacloud:
    api: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/ollama-cloud
    name: k8s-ollamacloud
    api_key: ${HERMES_OMLX_KEY}
    default_model: deepseek-v4-flash:cloud
  k8s-omlx:
    api: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/omlx
    name: k8s-omlx
    api_key: ${HERMES_OMLX_KEY}
    models:
      Qwen3.5-9B-MLX-4bit:
        context_length: 77824
      gemma-4-e4b-it-qat-OptiQ-4bit:
        context_length: 110592
      gemma-4-e2b-it-qat-OptiQ-4bit:
        context_length: 131072
      LFM2.5-2.6B-MLX-8bit:
        context_length: 131072
      LFM2.5-8B-A1B-MLX-8bit:
        context_length: 65536
      Ornith-1.5-9B-MLX-4bit:
        context_length: 86016
    default_model: Qwen3.5-9B-MLX-4bit
model_aliases:
  qwen35:
    model: Qwen3.5-9B-MLX-4bit
    provider: custom:k8s-omlx
  gemma4-e4b:
    model: gemma-4-e4b-it-qat-OptiQ-4bit
    provider: custom:k8s-omlx
fallback_providers:
  - provider: custom:k8s-omlx
    model: Qwen3.5-9B-MLX-4bit
auxiliary:
  compression:
    provider: custom:k8s-omlx
    model: gemma-4-e4b-it-qat-OptiQ-4bit
  session_search:
    provider: custom:k8s-omlx
    model: Qwen3.5-9B-MLX-4bit
  title_generation:
    provider: custom:k8s-omlx
    model: Qwen3.5-9B-MLX-4bit
toolsets:
  - hermes-cli
platform_toolsets:
  cli:
    - clarify
    - file
    - terminal
    - todo
  buzz:
    - clarify
    - file
    - terminal
    - todo
agent:
  max_turns: 40
  tool_use_enforcement: auto
  reasoning_effort: medium
  disabled_toolsets:
    - homeassistant
    - spotify
    - computer_use
    - browser
    - tts
    - stt
    - cronjob
    - delegation
browser:
  cloud_provider: camofox
  camofox:
    managed_persistence: true
terminal:
  backend: local
  cwd: /opt/data/profiles/bender/workspace
  timeout: 1800
  persistent_shell: true
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
display:
  platforms:
    buzz:
      interim_assistant_messages: false
      tool_progress: "off"
plugins:
  enabled:
    - memini
    - buzz-platform
memory:
  memory_enabled: false
web:
  search_backend: searxng
security:
  allow_private_urls: false
  redact_secrets: true
privacy:
  redact_pii: true
streaming:
  enabled: false
approvals:
  mode: smart
  timeout: 60
  cron_mode: deny
mcp_servers:
  obsidian:
    url: http://${OLLAMA_SRV1_IP}:27124/mcp
    headers:
      Authorization: "${OBSIDIAN_AUTH_HEADER}"
group_sessions_per_user: false
gateway:
  message_timestamps:
    enabled: true
  platforms:
    buzz:
      enabled: true
      extra:
        transport: auto
        require_mention: true
        poll_interval: 4
        allow_all_users: false
_config_version: 39
