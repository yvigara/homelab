# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dolt-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: dolt-credentials
    template:
      data:
        # `user`/`password` are what bd connects with; dolt-sql creates that
        # user on first boot and grants it ALL on the `beads` database only.
        user: beads
        password: "{{ .BEADS_DOLT_PASSWORD }}"
        root-password: "{{ .BEADS_DOLT_ROOT_PASSWORD }}"
  data:
    - secretKey: BEADS_DOLT_PASSWORD
      remoteRef:
        key: BEADS_DOLT_PASSWORD
    - secretKey: BEADS_DOLT_ROOT_PASSWORD
      remoteRef:
        key: BEADS_DOLT_ROOT_PASSWORD
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beads-serve-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  # Bearer token file for `bd serve --auth-token-file`: one token per line, all
  # accepted. Mounted as a directory so an updated secret reaches the pod without
  # a restart (bd re-reads the file about once a second).
  target:
    name: beads-serve-token
    template:
      data:
        tokens: "{{ .BEADS_SERVE_TOKEN }}"
  data:
    - secretKey: BEADS_SERVE_TOKEN
      remoteRef:
        key: BEADS_SERVE_TOKEN
