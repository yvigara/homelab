# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dolt-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: dolt-credentials
    template:
      data:
        # `user`/`password` are what bd connects with; dolt-sql creates that
        # user on first boot and grants it ALL on the `beads` database only.
        user: beads
        password: "{{ .BEADS_DOLT_PASSWORD }}"
        root-password: "{{ .BEADS_DOLT_ROOT_PASSWORD }}"
  data:
    - secretKey: BEADS_DOLT_PASSWORD
      remoteRef:
        key: BEADS_DOLT_PASSWORD
    - secretKey: BEADS_DOLT_ROOT_PASSWORD
      remoteRef:
        key: BEADS_DOLT_ROOT_PASSWORD
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beads-mcp-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  # Where beads-mcp verifies the Access JWT. Rendered from the same two Bitwarden
  # keys as the cloudflared ingress rule, so the team and AUD live in one place.
  target:
    name: beads-mcp-auth
    template:
      data:
        AUTH_ISSUER: "https://{{ .CF_ACCESS_TEAM_NAME }}.cloudflareaccess.com"
        AUTH_JWKS_URL: "https://{{ .CF_ACCESS_TEAM_NAME }}.cloudflareaccess.com/cdn-cgi/access/certs"
        AUTH_AUDIENCE: "{{ .CF_ACCESS_MCP_AUD }}"
  data:
    - secretKey: CF_ACCESS_TEAM_NAME
      remoteRef:
        key: CF_ACCESS_TEAM_NAME
    - secretKey: CF_ACCESS_MCP_AUD
      remoteRef:
        key: CF_ACCESS_MCP_AUD
