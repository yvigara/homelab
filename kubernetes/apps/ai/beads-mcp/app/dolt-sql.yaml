# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dolt-sql
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        # Single Dolt SQL server on a ReadWriteOnce volume.
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/dolthub/dolt-sql-server
              tag: 2.4.2@sha256:30c7e4fa8d3dd46be9728d7a5c341ceb2ffce7e42b484ef91c999c4c707525e9
            env:
              TZ: ${TIMEZONE}
              # The entrypoint only applies these on an empty /var/lib/dolt;
              # changing them later does not rotate anything.
              DOLT_ROOT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: dolt-credentials
                    key: root-password
              DOLT_DATABASE: beads
              DOLT_USER:
                valueFrom:
                  secretKeyRef:
                    name: dolt-credentials
                    key: user
              DOLT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: dolt-credentials
                    key: password
              # Host part of the DOLT_USER account; bd connects from the
              # beads-mcp pod, not localhost.
              DOLT_ROOT_HOST: "%"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3306
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: *app
        ports:
          mysql:
            port: *port
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /var/lib/dolt
