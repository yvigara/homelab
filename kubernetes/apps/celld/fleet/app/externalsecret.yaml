# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: celld
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: celld-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # celld reads the standard AWS credential chain. These are the RustFS
        # root credentials, the same pair RustFS and the buzz relay read.
        AWS_ACCESS_KEY_ID: "{{ .RUSTFS_ROOT_USER }}"
        AWS_SECRET_ACCESS_KEY: "{{ .RUSTFS_ROOT_PASSWORD }}"
  data:
    - secretKey: RUSTFS_ROOT_USER
      remoteRef:
        key: RUSTFS_ROOT_USER
    - secretKey: RUSTFS_ROOT_PASSWORD
      remoteRef:
        key: RUSTFS_ROOT_PASSWORD
