# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# GitHub App credentials for konflate's write-back (commit status + PR comment).
# konflate mints short-lived installation tokens from them and auto-detects the
# installation from the repo, so there is no standing token to rotate.
#
# The chart wires this Secret in with `envFrom`, so every key here lands as an
# environment variable. That is why the client ID rides along in the Secret rather
# than through `config.appClientId` — it keeps both halves of the credential in one
# place instead of splitting the non-secret half into cluster-secrets, which is
# provisioned by terraform in bootstrap/fluxcd/secrets.tf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate-github-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: konflate-github-app
    creationPolicy: Owner
    template:
      data:
        KONFLATE_APP_CLIENT_ID: "{{ .clientId }}"
        KONFLATE_APP_PRIVATE_KEY: "{{ .privateKey }}"
  data:
    - secretKey: clientId
      remoteRef:
        key: KONFLATE_GH_APP_CLIENT_ID
    - secretKey: privateKey
      remoteRef:
        key: KONFLATE_GH_APP_PRIVATE_KEY
