apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nack
spec:
  releaseName: nack
  chart:
    spec:
      # renovate: registryUrl=https://nats-io.github.io/k8s/helm/charts/
      chart: nack
      version: 0.33.2
      sourceRef:
        kind: HelmRepository
        name: nats-charts
  interval: 10m0s
  values:
    useLegacyNames: false
    jetstream:
      enabled: true
      additionalArgs:
        - --control-loop
      # NATS URL
      nats:
        url: nats://nats:4222
      tls:
        enabled: true
        secretName: nack-tls
