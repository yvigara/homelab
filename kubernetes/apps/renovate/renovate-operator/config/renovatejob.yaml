# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-github
spec:
  # Hourly discovery. Renovate itself only opens PRs when something actually
  # changed, and the per-repo schedule in renovate.json narrows when it may do so.
  schedule: "0 * * * *"
  image: ghcr.io/renovatebot/renovate:44.33.2
  parallelism: 4
  provider:
    name: github
    # endpoint defaults to https://api.github.com
  # Which repositories to process, out of those the GitHub App installation can
  # see. The installation is the real boundary: Renovate can only discover repos
  # the App was installed on, so this filter just narrows within that set.
  discoveryFilters:
    - yvigara/*
  # No PAT, no static token. The operator mints a short-lived installation access
  # token from these App credentials and injects it as RENOVATE_TOKEN.
  githubAppReference:
    secretName: renovate-github-app
    appIdSecretKey: APP_ID
    installationIdSecretKey: INSTALLATION_ID
    pemSecretKey: PEM
  # Global (self-hosted) Renovate config, mounted read-only and pointed at by
  # RENOVATE_CONFIG_FILE. JSON rather than JS deliberately: a .js config is
  # executed by the Renovate runtime, and nothing here needs that.
  #
  # platformCommit is what makes commits signed. With it enabled Renovate writes
  # commits through GitHub's API instead of `git`, and GitHub signs anything an App
  # commits that way — the "Verified" badge on every Renovate commit. It only works
  # for a GitHub App, which is why the PAT route cannot produce signed commits
  # without managing a GPG key yourself.
  #
  # It is set twice on purpose: once as a normal default, and once under `force`,
  # which outranks any repository's own renovate.json. A repo therefore cannot turn
  # signing off. Note that gitAuthor must stay unset — with platform commits GitHub
  # decides the author, and setting it is explicitly discouraged upstream.
  renovateConfig:
    fileName: config.json
    inline: |
      {
        "platformCommit": "enabled",
        "force": {
          "platformCommit": "enabled"
        },
        "onboardingConfig": {
          "extends": ["config:recommended"]
        }
      }
  extraEnv:
    - name: DOCKERHUB_USERNAME
      valueFrom:
        secretKeyRef:
          name: docker-hub-token
          key: DOCKERHUB_USERNAME
    - name: DOCKERHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: docker-hub-token
          key: DOCKERHUB_TOKEN
    - name: GHCR_TOKEN
      valueFrom:
        secretKeyRef:
          name: ghcr-token
          key: GHCR_TOKEN
    - name: RENOVATE_HOST_RULES
      value: >-
        [


          {
            "hostType": "docker",
            "matchHost": "docker.io",
            "username": "$(DOCKERHUB_USERNAME)",
            "password": "$(DOCKERHUB_TOKEN)"
          },
          {
            "hostType": "docker",
            "matchHost": "ghcr.io",
            "username": "x-access-token",
            "password": "$(GHCR_TOKEN)"
          }
        ]
    - name: RENOVATE_CACHE_DIR
      value: /cache
    - name: RENOVATE_REPOSITORY_CACHE
      value: enabled
    - name: RENOVATE_ALLOWED_UNSAFE_EXECUTIONS
      value: |-
        ["mise"]
  extraVolumes:
    - name: renovate-cache
      persistentVolumeClaim:
        claimName: renovate-cache
  extraVolumeMounts:
    - name: renovate-cache
      mountPath: /cache
  # Webhook-triggered runs, so ticking a Dependency Dashboard checkbox or a PR's
  # "rebase now" box acts within seconds instead of waiting for the next hour.
  # The hourly schedule above still drives normal discovery.
  #
  # sync makes the operator create its own webhook on every repository it
  # discovers, using the GitHub App token, and remove it again when a repo leaves
  # the set or this RenovateJob is deleted. That is why no webhook is configured
  # by hand on GitHub — but it does require the App to hold the "Webhooks:
  # Read and write" repository permission.
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-webhook-token
        key: token
    sync:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
