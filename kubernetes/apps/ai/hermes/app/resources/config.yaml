model:
  default: deepseek-v4-flash:cloud
  provider: custom:k8s-ollamacloud
custom_providers:
  - name: k8s-ollamacloud
    base_url: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/ollama-cloud
    api_key: "${HERMES_OMLX_KEY}"
    default_model: deepseek-v4-flash:cloud
  - name: k8s-omlx
    base_url: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/omlx
    api_key: "${HERMES_OMLX_KEY}"
    default_model: Qwen3.5-9B-MLX-4bit
    models:
      Qwen3.5-9B-MLX-4bit:
        context_length: 77824
      gemma-4-e4b-it-qat-OptiQ-4bit:
        context_length: 110592
      gemma-4-e2b-it-qat-OptiQ-4bit:
        context_length: 131072
      maple-preview-2bit-mlx:
        context_length: 131072
      LFM2.5-2.6B-MLX-4bit:
        context_length: 131072
      LFM2.5-2.6B-MLX-8bit:
        context_length: 131072
  - name: k8s-lfm2.5-2.6b
    base_url: http://lfm2-5-2-6b.ai.svc.cluster.local:8080
    default_model: lfm2.5-2.6b
model_aliases:
  qwen35:
    model: Qwen3.5-9B-MLX-4bit
    provider: custom:k8s-omlx
  gemma4-e4b:
    model: gemma-4-e4b-it-qat-OptiQ-4bit
    provider: custom:k8s-omlx
  gemma4-e2b:
    model: gemma-4-e2b-it-qat-OptiQ-4bit
    provider: custom:k8s-omlx
fallback_providers:
  - provider: custom:k8s-omlx
    model: Qwen3.5-9B-MLX-4bit
auxiliary:
  compression:
    provider: custom:k8s-omlx
    model: gemma-4-e4b-it-qat-OptiQ-4bit
  web_extract:
    provider: custom:k8s-omlx
    model: gemma-4-e4b-it-qat-OptiQ-4bit
  session_search:
    provider: custom:k8s-omlx
    model: Qwen3.5-9B-MLX-4bit
  vision:
    provider: custom:k8s-omlx
    model: gemma-4-e4b-it-qat-OptiQ-4bit
  title_generation:
    provider: custom:k8s-omlx
    model: Qwen3.5-9B-MLX-4bit
  profile_describer:
    provider: custom:k8s-omlx
    model: gemma-4-e2b-it-qat-OptiQ-4bit
  curator:
    provider: custom:k8s-omlx
    model: Qwen3.5-9B-MLX-4bit
    timeout: 600
toolsets:
  - hermes-cli
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - web
  slack:
    - browser
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - web
  buzz:
    - browser
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - web
skills:
  disabled:
    - airtable
    - audiocraft-audio-generation
    - baoyu-infographic
    - computer-use
    - gif-search
    - heartmula
    - hermes-desktop-plugins
    - inspecting-hermes-desktop-dom
    - jupyter-live-kernel
    - llama-cpp
    - manim-video
    - notion
    - obsidian
    - openhue
    - petdex
    - polymarket
    - research-paper-writing
    - serving-llms-vllm
    - songsee
    - songwriting-and-ai-music
    - teams-meeting-pipeline
    - touchdesigner-mcp
    - yuanbao
agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  tool_use_enforcement: auto
  reasoning_effort: medium
  disabled_toolsets:
    - homeassistant
    - spotify
    - computer_use
    - tts
    - stt
# Camofox (anti-detection Camoufox server) is the browser backend. Selecting it
# here is what activates it - CAMOFOX_URL alone only supplies the address.
# It has no CDP endpoint, so Hermes keeps its built-in browser tools rather than
# the browser-use harness.
browser:
  cloud_provider: camofox
  camofox:
    # Stable per-profile user id, so the server maps sessions onto its
    # persistent profile directory and logins survive agent restarts.
    managed_persistence: true
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
display:
  platforms:
    buzz:
      interim_assistant_messages: false
      tool_progress: "off"
plugins:
  enabled:
    - memini
    - buzz-platform
memory:
  memory_enabled: true
  user_profile_enabled: false
  write_approval: false
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: memini
  flush_min_turns: 6
  nudge_interval: 10
security:
  allow_private_urls: false
  redact_secrets: true
privacy:
  redact_pii: true
streaming:
  enabled: false
approvals:
  mode: smart
  timeout: 60
  cron_mode: deny
mcp_servers:
  linkedin:
    url: http://${OLLAMA_SRV1_IP}:9080/mcp
  jira:
    url: https://mcp.atlassian.com/v1/mcp/authv2
    auth: oauth
    # meeting-notes:
    # url: ${MEETING_NOTES_MCP_URL}
    # auth: oauth
  obsidian:
    url: http://${OLLAMA_SRV1_IP}:27124/mcp
    headers:
      Authorization: ${OBSIDIAN_AUTH_HEADER}
  x:
    command: npx
    args: ["-y", "@xdevplatform/xurl", "mcp", "https://api.x.com/mcp"]
    headers:
      Authorization: ${X_MCP_AUTH_HEADER}
group_sessions_per_user: false
gateway:
  message_timestamps:
    enabled: true
  platforms:
    buzz:
      enabled: true
      extra:
        transport: auto
        require_mention: true
        poll_interval: 4
        allow_all_users: false
        allowed_users:
          - ${BUZZ_OWNER_PUBKEY}
dashboard:
  oauth:
    provider: self-hosted
    self_hosted:
      client_id: hermes-dashboard
web:
  search_backend: searxng
slack:
  reaction_triggers: true
