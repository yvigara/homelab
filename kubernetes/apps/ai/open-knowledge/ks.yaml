# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-knowledge
spec:
  targetNamespace: ai
  dependsOn:
    # The public /mcp edge routes through the agentgateway proxy, which owns the
    # Auth0 JWT policy and the ReferenceGrant that lets this namespace reach it.
    - name: agentgateway
      namespace: agentgateway-system
  path: ./kubernetes/apps/ai/open-knowledge/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 5m
