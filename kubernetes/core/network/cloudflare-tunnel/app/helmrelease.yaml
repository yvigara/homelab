# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      cloudflare-tunnel:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: mirror.gcr.io/cloudflare/cloudflared
              tag: 2026.6.1@sha256:6d91c121b803126f7a5344005d17a9324788fc09d305b6e2560ec6040a7ae283
            env:
              NO_AUTOUPDATE: true
              TUNNEL_METRICS: 0.0.0.0:8080
              TUNNEL_TRANSPORT_PROTOCOL: auto
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            args:
              - tunnel
              - run
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
    configMaps:
      config:
        data:
          config.yaml: |-
            ingress:
              - hostname: "*.${DOMAIN}"
                service: https://traefik.{{ .Release.Namespace }}.svc.cluster.local:443
                originRequest:
                  http2Origin: true
                  keepAliveTimeout: 3600s
                  originServerName: tun-${CLUSTER_NAME}.${DOMAIN}
                  tcpKeepAlive: 7200s
                  matchSNItoHost: true
                  noTLSVerify: true
              - hostname: "*.${CLUSTER_NAME}.${DOMAIN}"
                service: https://traefik.{{ .Release.Namespace }}.svc.cluster.local:443
                originRequest:
                  http2Origin: true
                  keepAliveTimeout: 3600s
                  originServerName: tun-${CLUSTER_NAME}.${DOMAIN}
                  tcpKeepAlive: 7200s
                  matchSNItoHost: true
                  noTLSVerify: true
              - hostname: "${REGION}.${ENVIRONMENT}.${DOMAIN}"
                service: https://traefik.{{ .Release.Namespace }}.svc.cluster.local:443
                originRequest:
                  http2Origin: true
                  keepAliveTimeout: 3600s
                  originServerName: tun-${CLUSTER_NAME}.${DOMAIN}
                  tcpKeepAlive: 7200s
                  matchSNItoHost: true
                  noTLSVerify: true
              - hostname: "*.${REGION}.${ENVIRONMENT}.${DOMAIN}"
                service: https://traefik.{{ .Release.Namespace }}.svc.cluster.local:443
                originRequest:
                  http2Origin: true
                  keepAliveTimeout: 3600s
                  originServerName: tun-${CLUSTER_NAME}.${DOMAIN}
                  tcpKeepAlive: 7200s
                  matchSNItoHost: true
                  noTLSVerify: true
              - service: http_status:404
    persistence:
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/cloudflared/config.yaml
            subPath: config.yaml
