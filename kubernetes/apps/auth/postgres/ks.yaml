# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ory-postgres
spec:
  interval: 1h
  path: ./kubernetes/apps/auth/postgres/app
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: auth
  # wait until the CNPG clusters report Ready so Hydra/Kratos migrations can connect
  wait: true
  timeout: 15m
