---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: renovate-operator
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 6.3.0
  url: oci://ghcr.io/mogenius/helm-charts/renovate-operator
  # The chart is cosign-signed keylessly by the upstream release workflow, same as
  # the flux-operator chart in kubernetes/clusters/lab/sed-lab-01/flux-system.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token.actions.githubusercontent.com$
        subject: ^https://github.com/mogenius/renovate-operator.*$
