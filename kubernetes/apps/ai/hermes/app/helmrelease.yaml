apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          init:
            image: &app_image
              repository: nousresearch/hermes-agent
              tag: v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e
            env:
              HOME: /opt/data
              MISE_VERSION: v2026.8.5
              MISE_INSTALL_PATH: /opt/data/.local/bin/mise
              MISE_INSTALL_SKIP_IF_EXISTS: "1"
              MISE_YES: "1"
            command:
              - bash
              - -c
              - |
                set -euo pipefail
                cp /run/config/config.yaml /opt/data/config.yaml
                chown hermes:hermes /opt/data/config.yaml

                echo 'export PATH="/opt/data/.local/bin:/opt/data/.local/share/mise/shims:$PATH"' > /opt/data/.profile

                mkdir -p /opt/data/.config/mise /opt/data/.local/bin \
                  /opt/data/.local/share/mise /opt/data/.local/state/mise /opt/data/.cache/mise
                cp /run/config/mise.toml /opt/data/.config/mise/config.toml

                # no-ops when $MISE_INSTALL_PATH is already at $MISE_VERSION
                curl -fsSL https://mise.run | sh

                # real activation for interactive `kubectl exec` shells
                touch /opt/data/.bashrc
                grep -qF '/opt/data/.local/bin/mise activate bash' /opt/data/.bashrc \
                  || echo 'eval "$(/opt/data/.local/bin/mise activate bash)"' >> /opt/data/.bashrc

                mkdir -p /opt/data/.cache/mise
                chown -R hermes:hermes /opt/data/.bashrc /opt/data/.config/mise \
                  /opt/data/.local/bin/mise /opt/data/.local/share/mise \
                  /opt/data/.local/state/mise /opt/data/.cache/mise
                su - hermes -c "$MISE_INSTALL_PATH install"
        containers:
          app:
            image: *app_image
            args:
              - "gateway"
              - "run"
            env:
              TZ: ${TIMEZONE}
              API_SERVER_ENABLED: true
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_PORT: &app_port 8642
              HERMES_GID: "1000"
              HERMES_HOME: /opt/data
              HERMES_UID: "1000"
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_PUBLIC_URL: "https://hermes.${DOMAIN}"
              HERMES_DASHBOARD_OIDC_ISSUER: "https://dex.${DOMAIN}"
              HERMES_DASHBOARD_OIDC_CLIENT_ID: "hermes-dashboard-public"
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              MEMINI_NAMESPACE: hermes
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: MEMINI_API_KEY
              SEARXNG_URL: http://searxng.ai.svc.cluster.local:8080
              WHATSAPP_ENABLED: true
              WHATSAPP_MODE: self-chat
              HOME: /opt/data
              TERM: xterm-256color
              PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/opt/data/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            envFrom:
              - configMapRef:
                  name: cluster-vars
              - secretRef:
                  name: hermes-secret
            ports:
              - containerPort: *app_port
                name: gateway
                protocol: TCP
              - containerPort: &dashboard_port 9119
                name: dashboard
                protocol: TCP
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
    service:
      app:
        controller: hermes
        ports:
          gateway:
            port: *app_port
          dashboard:
            port: *dashboard_port
    route:
      dashboard:
        hostnames:
          - "hermes.int.${REGION}.${ENVIRONMENT}.${DOMAIN}"
        parentRefs:
          - name: traefik-private
            namespace: network
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
      public-dashboard:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - "hermes.${DOMAIN}"
        parentRefs:
          - name: traefik-public
            namespace: network
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
      api:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - "hermes-api.${DOMAIN}"
        parentRefs:
          - name: traefik-public
            namespace: network
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: gateway
    persistence:
      data:
        existingClaim: hermes
        globalMounts:
          - path: /opt/data
      config:
        type: configMap
        name: hermes-configmap
        defaultMode: 0644
        advancedMounts:
          hermes:
            init:
              - path: /run/config/config.yaml
                subPath: config.yaml
              - path: /run/config/mise.toml
                subPath: mise.toml
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /run
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
