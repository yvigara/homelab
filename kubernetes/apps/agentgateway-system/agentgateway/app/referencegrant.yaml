# The open-knowledge HTTPRoute in the `ai` namespace sends /mcp to this
# gateway's internal Service so the knowledge base's public MCP endpoint
# inherits the Auth0 JWT policy. Gateway API requires the target namespace to
# consent to a cross-namespace backendRef.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: ai-httproute-to-agentgateway-proxy
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: ai
  to:
    - group: ""
      kind: Service
      name: agentgateway-proxy-int
