---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
#
# The operator watches RenovateJob CRs and turns each one into a scheduled discovery
# Job plus one executor Job per discovered repository. It holds no credential itself:
# the GitHub App credentials live in the RenovateJob's `githubAppReference`, and the
# operator mints a short-lived installation token from them per run.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  values:
    fullnameOverride: renovate-operator

    config:
      # Keep finished Jobs around for a day so their logs are still readable in the
      # UI after a run, then let Kubernetes GC them instead of growing forever
      # (the chart default of -1 keeps every Job indefinitely).
      jobTTLSecondsAfterFinished: 86400
      deleteSuccessfulJobs: false
      # Bound how many executor Jobs can run at once across every RenovateJob, so a
      # large discovery round cannot saturate the cluster.
      globalParallelismLimit: 4
      # Hand each Renovate pod the Dragonfly URL as RENOVATE_REDIS_URL, so package
      # lookups are cached between runs rather than re-fetched every time.
      forwardCacheToJobs: true

    # Reuse the existing Dragonfly in the database namespace rather than deploying
    # the chart's bundled Valkey. It runs without auth (see
    # kubernetes/apps/database/dragonfly/cluster), so host + port is the whole config.
    externalKeyValueStore:
      host: dragonfly.database.svc.cluster.local
      port: 6379

    # The operator acts on a RenovateJob with its own cluster credentials, so the
    # policy engine bounds what a RenovateJob can make it do — reach a host that is
    # not GitHub, read a Secret it was not pointed at, or run a non-Renovate image.
    # It ships off; turning it on is the upstream recommendation for anything that
    # is not a throwaway cluster. A refused job reports the reason on itself:
    #   kubectl -n renovate get renovatejobs -o wide
    policy:
      enabled: true
      allowedHosts:
        - api.github.com
        - github.com
      allowedImages:
        - ghcr.io/renovatebot/renovate
      # Secrets named by spec.githubAppReference must carry the label
      # renovate-operator.mogenius.com/allow-ref: "true" — see config/externalsecret.yaml.
      requireSecretRefOptIn: true
      allowRootUser: false

    # The UI is exposed by ./httproute.yaml instead, matching how flux-operator and
    # the traefik dashboard are routed in this repo. No authentication provider is
    # configured, so every request the private gateway lets through is treated as an
    # admin — see the OIDC note in the PR description before exposing this publicly.
    route:
      enabled: false

    # Inbound webhooks would need a publicly reachable endpoint; the RenovateJob
    # runs on a cron schedule instead.
    webhook:
      enabled: false

    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
