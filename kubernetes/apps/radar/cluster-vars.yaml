apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
data:
  CLUSTER_NAME: ${CLUSTER_NAME}
  DOMAIN: ${DOMAIN}
  ENVIRONMENT: ${ENVIRONMENT}
  REGION: ${CLUSTER_REGION}
  CLUSTER_ADMIN_EMAIL_1: ${CLUSTER_ADMIN_EMAIL_1}
  CLUSTER_ADMIN_EMAIL_2: ${CLUSTER_ADMIN_EMAIL_2}
  TIMEZONE: "Australia/Melbourne"
