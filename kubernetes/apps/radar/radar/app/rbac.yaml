# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.authorization.k8s.io/clusterrolebinding_v1.json
# Radar impersonates the Dex user, so access comes from here. Dex's GitHub
# connector emits the org name as a group (see `orgs` in the dex HelmRelease).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: radar-viewers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: celest-io
    # Dex emits no groups for either connector in practice (Radar logs show
    # groups: []), so the group above never matches; bind users directly.
    # Emails come from CLUSTER_ADMIN_EMAILS via terraform/flux-runtime-info
    # (two entries expected).
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: ${CLUSTER_ADMIN_EMAIL_1}
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: ${CLUSTER_ADMIN_EMAIL_2}
