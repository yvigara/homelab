model:
  default: Qwen3.5-9B-OptiQ-4bit
  provider: custom:k8s-omlx
  context_length: 65536
custom_providers:
  - name: k8s-ollama
    base_url: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/ollama
    default_model: qwen3.5:9b-mlx
    models:
      - qwen3.5:9b-mlx
      - qwen3-embedding:4b
      - Bonsai-27B-gguf:Q1_0
      - gemma4:12b-mlx
  - name: k8s-omlx
    base_url: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/omlx
    default_model: Qwen3.5-9B-OptiQ-4bit
    models:
      - gemma-4-12B-it-qat-OptiQ-4bit
      - Qwen3.5-9B-8bit
      - Qwen3.5-9B-OptiQ-4bit
fallback_providers: []
toolsets:
  - hermes-cli
agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  tool_use_enforcement: auto
  reasoning_effort: medium
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
plugins:
  enabled:
    - memini
memory:
  memory_enabled: true
  user_profile_enabled: false
  write_approval: false
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: memini
  flush_min_turns: 6
  nudge_interval: 10
security:
  allow_private_urls: false
  redact_secrets: true
privacy:
  redact_pii: true
streaming:
  enabled: false
mcp_servers:
  linkedin:
    url: http://${OLLAMA_SRV1_IP}:9080/mcp
  jira:
    url: https://mcp.atlassian.com/v1/mcp/authv2
    auth: oauth
    # meeting-notes:
    # url: ${MEETING_NOTES_MCP_URL}
    # auth: oauth
group_sessions_per_user: false
gateway:
  message_timestamps:
    enabled: true
dashboard:
  oauth:
    provider: self-hosted
    self_hosted:
      client_id: hermes-dashboard
web:
  search_backend: searxng
