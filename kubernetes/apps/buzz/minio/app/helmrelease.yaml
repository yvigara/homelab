# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      minio:
        annotations:
          reloader.stakater.com/auto: "true"
        # Single ReadWriteOnce hostpath volume: the old pod has to release it
        # before the new one can bind it.
        strategy: Recreate
        containers:
          main:
            image:
              repository: docker.io/minio/minio
              tag: RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
            args:
              - server
              - /data
            env:
              # MinIO creates .minio/certs under the home directory at startup,
              # and the image's default home is not writable by uid 1000.
              HOME: &home /home/minio
              # API only. The community console is frozen upstream and nothing
              # in this cluster routes to it.
              MINIO_BROWSER: "off"
              MINIO_UPDATE: "off"
            envFrom:
              - secretRef:
                  name: minio
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /minio/health/live
                    port: &port 9000
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              # MinIO still writes outside its home and data directories, so
              # the root filesystem stays writable.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 50Gi
        storageClass: openebs-hostpath
        globalMounts:
          - path: /data
      home:
        type: emptyDir
        globalMounts:
          - path: *home
    service:
      app:
        ports:
          http:
            port: *port
