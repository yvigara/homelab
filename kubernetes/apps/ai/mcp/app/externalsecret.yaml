# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  # Read by agentgateway's `obsidian` target (policies.auth.secretRef): the
  # Authorization key becomes the header sent to the Obsidian REST API plugin.
  target:
    name: obsidian-mcp
    creationPolicy: Owner
    template:
      data:
        Authorization: "Bearer {{ .OBSIDIAN_API_KEY }}"
  data:
    - secretKey: OBSIDIAN_API_KEY
      remoteRef:
        key: OBSIDIAN_API_KEY
