# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kratos-ui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile: { type: RuntimeDefault }
    controllers:
      kratos-ui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: oryd/kratos-selfservice-ui-node
              tag: v26.2.0
            env:
              PORT: "3000"
              # server-side (in-cluster) Kratos public API
              KRATOS_PUBLIC_URL: http://kratos-public.auth.svc.cluster.local:80/
              # browser-facing Kratos public API
              KRATOS_BROWSER_URL: https://kratos.${DOMAIN}/
              # lets the UI resolve & accept Hydra login/consent challenges
              HYDRA_ADMIN_URL: http://hydra-admin.auth.svc.cluster.local:4445/
              BASE_URL: https://login.${DOMAIN}/
            envFrom:
              - secretRef:
                  name: kratos-ui-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: kratos-ui
        ports:
          http:
            port: 3000
