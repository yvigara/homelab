# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-knowledge
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # The node images ship a `node` user at 1000:1000; the PVC is handed to
        # it via fsGroup so the CLI install and the git tree are both writable.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      open-knowledge:
        annotations:
          reloader.stakater.com/auto: "true"
        # The collaboration server is single-writer: exactly one process per
        # project volume. Recreate (not RollingUpdate) keeps a new pod from
        # attaching to the volume while the old one still holds it.
        replicas: 1
        strategy: Recreate
        initContainers:
          install:
            image: &app_image
              repository: docker.io/library/node
              # The full Debian variant, not -slim: git is a hard boot
              # requirement (the server runs a git preflight, and the timeline
              # and recovery subsystems shell out to the binary), and only this
              # variant already carries it.
              tag: 24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
            command: ["bash", "/run/config/install.sh"]
            env:
              HOME: &data_dir /data
              # Global npm prefix on the volume, deliberately outside the
              # project dir so node_modules never lands in the knowledge base.
              NPM_CONFIG_PREFIX: &npm_prefix /data/.npm-global
              OK_PROJECT_DIR: &project_dir /data/project
              # renovate: datasource=npm depName=@inkeep/open-knowledge
              OK_VERSION: &ok_version 0.61.3
              GIT_AUTHOR_NAME: &git_name open-knowledge
              GIT_AUTHOR_EMAIL: &git_email open-knowledge@${DOMAIN}
              PATH: &path /data/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              TZ: ${TIMEZONE}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
        containers:
          app:
            image: *app_image
            command: ["bash", "/run/config/start.sh"]
            env:
              HOME: *data_dir
              NPM_CONFIG_PREFIX: *npm_prefix
              OK_PROJECT_DIR: *project_dir
              OK_VERSION: *ok_version
              GIT_AUTHOR_NAME: *git_name
              GIT_AUTHOR_EMAIL: *git_email
              PATH: *path
              TZ: ${TIMEZONE}
              PORT: &app_port 8080
              # Reachable from the pod network. A wildcard bind contributes no
              # admitted Host name of its own, which is why OK_EXTERNAL_URL
              # below is the only non-loopback host the server answers to.
              OK_BIND: 0.0.0.0
              # Exposure consent interlock — without it the server refuses to boot.
              OK_ALLOW_EXTERNAL: "1"
              # The canonical public origin. It is both the sole Host allowlist
              # entry and the origin the server builds its wss:// and preview
              # URLs from, so every caller — browsers through oauth2-proxy,
              # agents through agentgateway, Hermes in-cluster — has to present
              # this exact Host or get a 403.
              OK_EXTERNAL_URL: https://ok.${DOMAIN}
              # The idle timer only counts editor WebSocket clients, so a server
              # busy serving remote agents looks idle and would tear itself down
              # mid-session.
              OK_IDLE_SHUTDOWN: "off"
            probes:
              # /healthz and /readyz are mounted above every admission gate
              # precisely so orchestrator probes — which arrive with an IP Host
              # header — are not refused.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *app_port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *app_port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              startup:
                enabled: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
          # Browser login edge. OpenKnowledge has no user accounts of its own —
          # everyone who can reach it is the same owner — so the public hostname
          # is fronted by Dex SSO, the same provider the Hermes dashboard and
          # RustFS already use. Agents never come through here; /mcp is routed
          # around this container (see the route block below).
          oauth2-proxy:
            image:
              repository: quay.io/oauth2-proxy/oauth2-proxy
              # Digest deliberately absent on this first commit: quay.io was not
              # reachable from the environment this was authored in, so no digest
              # could be resolved to pin. Renovate pins it on its first run.
              tag: v7.15.4
            env:
              TZ: ${TIMEZONE}
              OAUTH2_PROXY_PROVIDER: oidc
              OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Celestio SSO
              OAUTH2_PROXY_OIDC_ISSUER_URL: https://dex.${DOMAIN}
              OAUTH2_PROXY_CLIENT_ID: open-knowledge
              OAUTH2_PROXY_REDIRECT_URL: https://ok.${DOMAIN}/oauth2/callback
              OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
              OAUTH2_PROXY_UPSTREAMS: http://127.0.0.1:8080/
              OAUTH2_PROXY_SCOPE: openid profile email groups
              # Dex already gates login on membership of the celest-io GitHub
              # org, so any identity that reaches this point is authorized;
              # there is no second email-domain rule worth enforcing here.
              OAUTH2_PROXY_EMAIL_DOMAINS: "*"
              # The post-login redirect is built from the forwarded host, and a
              # host missing from this list is refused — without it the login
              # silently loops back to itself.
              OAUTH2_PROXY_WHITELIST_DOMAINS: ok.${DOMAIN}
              OAUTH2_PROXY_REVERSE_PROXY: "true"
              OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
              OAUTH2_PROXY_COOKIE_SECURE: "true"
              # Keeps the Host the client dialed, which is what the server
              # matches against OK_EXTERNAL_URL. Rewriting it to 127.0.0.1:8080
              # would turn every editor request into a 403.
              OAUTH2_PROXY_PASS_HOST_HEADER: "true"
              # Live editing rides a WebSocket this proxy has to pass through.
              OAUTH2_PROXY_PROXY_WEBSOCKETS: "true"
              # Never buffer a streamed response, or the collab socket and any
              # SSE leg behind it stall.
              OAUTH2_PROXY_FLUSH_INTERVAL: 100ms
            envFrom:
              - secretRef:
                  name: open-knowledge-secret
            probes:
              liveness: &proxy_probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &proxy_port 4180
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *proxy_probes
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    service:
      app:
        controller: open-knowledge
        ports:
          # Public browser traffic enters here, behind the Dex login.
          http:
            port: *proxy_port
            primary: true
          # The server itself, reached only from inside the cluster: by
          # agentgateway for the public /mcp edge, and by Hermes directly.
          server:
            port: *app_port
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - ok.${DOMAIN}
        parentRefs:
          - name: traefik-public
            namespace: network
            sectionName: websecure
        rules:
          # Agents: /mcp and its OAuth discovery documents skip the browser
          # login and go to agentgateway, which enforces the same Auth0 JWT
          # policy as the rest of the cluster's MCP surface. A headless agent
          # cannot complete a cookie login — sent through oauth2-proxy it would
          # get an HTML login page back instead of a tool list. agentgateway
          # forwards the caller's original authority upstream, so the server
          # still sees Host: ok.${DOMAIN} and admits the request.
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
              - path:
                  type: PathPrefix
                  value: /.well-known/oauth-protected-resource
              - path:
                  type: PathPrefix
                  value: /.well-known/oauth-authorization-server
            backendRefs:
              - kind: Service
                name: agentgateway-proxy-int
                namespace: agentgateway-system
                port: 80
          # Everyone else: the editor, behind Dex.
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: open-knowledge
        globalMounts:
          - path: *data_dir
      config:
        type: configMap
        name: open-knowledge-configmap
        defaultMode: 0555
        advancedMounts:
          open-knowledge:
            install:
              - path: /run/config
            app:
              - path: /run/config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
