# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  # Credentials that belong to the container rather than to the agent running in
  # it. This Secret is consumed with envFrom, so every key lands in the container
  # env and is inherited by every process there. Anything scoped to one agent
  # goes to hermes-profile-env below instead.
  target:
    name: hermes-secret
    template:
      data:
        CLAUDE_CODE_OAUTH_TOKEN: "{{ .CLAUDE_CODE_OAUTH_TOKEN }}"
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        CAMOFOX_API_KEY: "{{ .CAMOFOX_API_KEY }}"
        MEETING_NOTES_MCP_URL: "{{ .MEETING_NOTES_MCP_URL }}"
        OBSIDIAN_AUTH_HEADER: "Bearer {{ .OBSIDIAN_API_KEY }}"
        X_MCP_AUTH_HEADER: "Bearer {{ .X_MCP_BEARER_TOKEN }}"
        X_MCP_CLIENT_ID: "{{ .X_MCP_CLIENT_ID }}"
        X_MCP_CLIENT_SECRET: "{{ .X_MCP_CLIENT_SECRET }}"
        HERMES_OMLX_KEY: "{{ .HERMES_OMLX_KEY }}"
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: CLAUDE_CODE_OAUTH_TOKEN
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: MEMINI_API_KEY
    - secretKey: CAMOFOX_API_KEY
      remoteRef:
        key: CAMOFOX_API_KEY
    - secretKey: MEETING_NOTES_MCP_URL
      remoteRef:
        key: MEETING_NOTES_MCP_URL
    - secretKey: OBSIDIAN_API_KEY
      remoteRef:
        key: OBSIDIAN_API_KEY
    - secretKey: X_MCP_BEARER_TOKEN
      remoteRef:
        key: X_MCP_BEARER_TOKEN
    - secretKey: X_MCP_CLIENT_ID
      remoteRef:
        key: X_MCP_CLIENT_ID
    - secretKey: X_MCP_CLIENT_SECRET
      remoteRef:
        key: X_MCP_CLIENT_SECRET
    - secretKey: HERMES_OMLX_KEY
      remoteRef:
        key: HERMES_OMLX_KEY
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-profile-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  # One dotenv fragment per profile, keyed <profile>.env, mounted as files
  # rather than exported into the container env. Everything here belongs to a
  # single agent: the port its gateway listens on, the credentials it claims,
  # the memory namespace it writes to. In the container env instead, none of it
  # could be overridden per agent - Hermes resolves process env above both
  # config.yaml and .env - and a bot token is locked to one agent anyway.
  #
  # `default.env` is the whole .env for the default profile. Every other
  # fragment is appended to the .env that profiles-init.sh builds from that
  # profile's ConfigMap, so only the secret half lives here.
  target:
    name: hermes-profile-env
    template:
      data:
        default.env: |
          # Managed by Flux - rewritten from this Secret on every pod start.
          # `hermes config set` writes into this file too; anything set that way
          # is lost on the next restart unless it is added here as well.

          # OpenAI-compatible API server, published at hermes-api.${DOMAIN}.
          API_SERVER_ENABLED="true"
          API_SERVER_HOST="0.0.0.0"
          API_SERVER_PORT="8642"
          API_SERVER_KEY="{{ .HERMES_API_SERVER_KEY }}"

          # Memory namespace. One agent per namespace, or two agents read and
          # write each other's recall.
          MEMINI_NAMESPACE="hermes/default"

          # The agent's own Nostr identity on the Buzz relay (nsec or 64 hex).
          # Its pubkey has to be a relay member - see kubernetes/apps/buzz/README.md.
          BUZZ_RELAY_URL="wss://buzz.${DOMAIN}"
          BUZZ_PRIVATE_KEY="{{ .HERMES_BUZZ_PRIVATE_KEY }}"
          BUZZ_ALLOWED_USERS="${BUZZ_OWNER_PUBKEY}"

          SLACK_BOT_TOKEN="{{ .SLACK_BOT_TOKEN }}"
          SLACK_APP_TOKEN="{{ .SLACK_APP_TOKEN }}"
          SLACK_ALLOWED_CHANNELS="{{ .SLACK_ALLOWED_CHANNELS }}"
          SLACK_ALLOWED_USERS="{{ .SLACK_ALLOWED_USERS }}"
          SLACK_HOME_CHANNEL="{{ .SLACK_HOME_CHANNEL }}"
          SLACK_HOME_CHANNEL_NAME="{{ .SLACK_HOME_CHANNEL_NAME }}"
        # Each agent gets its own Nostr identity on the Buzz relay. The
        # pubkey has to be a relay member before the agent can use it -
        # see kubernetes/apps/buzz/README.md.
        amy.env: |
          # Managed by Flux - appended to amy's .env on every pod start.
          BUZZ_RELAY_URL="wss://buzz.${DOMAIN}"
          BUZZ_PRIVATE_KEY="{{ .HERMES_BUZZ_PRIVATE_KEY_AMY }}"
          BUZZ_ALLOWED_USERS="${BUZZ_OWNER_PUBKEY}"
        bender.env: |
          # Managed by Flux - appended to bender's .env on every pod start.
          BUZZ_RELAY_URL="wss://buzz.${DOMAIN}"
          BUZZ_PRIVATE_KEY="{{ .HERMES_BUZZ_PRIVATE_KEY_BENDER }}"
          BUZZ_ALLOWED_USERS="${BUZZ_OWNER_PUBKEY}"
        conrad.env: |
          # Managed by Flux - appended to conrad's .env on every pod start.
          BUZZ_RELAY_URL="wss://buzz.${DOMAIN}"
          BUZZ_PRIVATE_KEY="{{ .HERMES_BUZZ_PRIVATE_KEY_CONRAD }}"
          BUZZ_ALLOWED_USERS="${BUZZ_OWNER_PUBKEY}"
        farnsworth.env: |
          # Managed by Flux - appended to farnsworth's .env on every pod start.
          BUZZ_RELAY_URL="wss://buzz.${DOMAIN}"
          BUZZ_PRIVATE_KEY="{{ .HERMES_BUZZ_PRIVATE_KEY_FARNSWORTH }}"
          BUZZ_ALLOWED_USERS="${BUZZ_OWNER_PUBKEY}"
        fry.env: |
          # Managed by Flux - appended to fry's .env on every pod start.
          BUZZ_RELAY_URL="wss://buzz.${DOMAIN}"
          BUZZ_PRIVATE_KEY="{{ .HERMES_BUZZ_PRIVATE_KEY_FRY }}"
          BUZZ_ALLOWED_USERS="${BUZZ_OWNER_PUBKEY}"
        leela.env: |
          # Managed by Flux - appended to leela's .env on every pod start.
          BUZZ_RELAY_URL="wss://buzz.${DOMAIN}"
          BUZZ_PRIVATE_KEY="{{ .HERMES_BUZZ_PRIVATE_KEY_LEELA }}"
          BUZZ_ALLOWED_USERS="${BUZZ_OWNER_PUBKEY}"
        mom.env: |
          # Managed by Flux - appended to mom's .env on every pod start.
          BUZZ_RELAY_URL="wss://buzz.${DOMAIN}"
          BUZZ_PRIVATE_KEY="{{ .HERMES_BUZZ_PRIVATE_KEY_MOM }}"
          BUZZ_ALLOWED_USERS="${BUZZ_OWNER_PUBKEY}"
        morbo.env: |
          # Managed by Flux - appended to morbo's .env on every pod start.
          BUZZ_RELAY_URL="wss://buzz.${DOMAIN}"
          BUZZ_PRIVATE_KEY="{{ .HERMES_BUZZ_PRIVATE_KEY_MORBO }}"
          BUZZ_ALLOWED_USERS="${BUZZ_OWNER_PUBKEY}"
        nibbler.env: |
          # Managed by Flux - appended to nibbler's .env on every pod start.
          BUZZ_RELAY_URL="wss://buzz.${DOMAIN}"
          BUZZ_PRIVATE_KEY="{{ .HERMES_BUZZ_PRIVATE_KEY_NIBBLER }}"
          BUZZ_ALLOWED_USERS="${BUZZ_OWNER_PUBKEY}"
        nixon.env: |
          # Managed by Flux - appended to nixon's .env on every pod start.
          BUZZ_RELAY_URL="wss://buzz.${DOMAIN}"
          BUZZ_PRIVATE_KEY="{{ .HERMES_BUZZ_PRIVATE_KEY_NIXON }}"
          BUZZ_ALLOWED_USERS="${BUZZ_OWNER_PUBKEY}"
        wernstrom.env: |
          # Managed by Flux - appended to wernstrom's .env on every pod start.
          BUZZ_RELAY_URL="wss://buzz.${DOMAIN}"
          BUZZ_PRIVATE_KEY="{{ .HERMES_BUZZ_PRIVATE_KEY_WERNSTROM }}"
          BUZZ_ALLOWED_USERS="${BUZZ_OWNER_PUBKEY}"
  data:
    - secretKey: HERMES_API_SERVER_KEY
      remoteRef:
        key: HERMES_API_SERVER_KEY
    - secretKey: HERMES_BUZZ_PRIVATE_KEY
      remoteRef:
        key: HERMES_BUZZ_PRIVATE_KEY
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: SLACK_BOT_TOKEN
    - secretKey: SLACK_APP_TOKEN
      remoteRef:
        key: SLACK_APP_TOKEN
    - secretKey: SLACK_ALLOWED_CHANNELS
      remoteRef:
        key: SLACK_ALLOWED_CHANNELS
    - secretKey: SLACK_ALLOWED_USERS
      remoteRef:
        key: SLACK_ALLOWED_USERS
    - secretKey: SLACK_HOME_CHANNEL
      remoteRef:
        key: SLACK_HOME_CHANNEL
    - secretKey: SLACK_HOME_CHANNEL_NAME
      remoteRef:
        key: SLACK_HOME_CHANNEL_NAME
    - secretKey: HERMES_BUZZ_PRIVATE_KEY_AMY
      remoteRef:
        key: HERMES_BUZZ_PRIVATE_KEY_AMY
    - secretKey: HERMES_BUZZ_PRIVATE_KEY_BENDER
      remoteRef:
        key: HERMES_BUZZ_PRIVATE_KEY_BENDER
    - secretKey: HERMES_BUZZ_PRIVATE_KEY_CONRAD
      remoteRef:
        key: HERMES_BUZZ_PRIVATE_KEY_CONRAD
    - secretKey: HERMES_BUZZ_PRIVATE_KEY_FARNSWORTH
      remoteRef:
        key: HERMES_BUZZ_PRIVATE_KEY_FARNSWORTH
    - secretKey: HERMES_BUZZ_PRIVATE_KEY_FRY
      remoteRef:
        key: HERMES_BUZZ_PRIVATE_KEY_FRY
    - secretKey: HERMES_BUZZ_PRIVATE_KEY_LEELA
      remoteRef:
        key: HERMES_BUZZ_PRIVATE_KEY_LEELA
    - secretKey: HERMES_BUZZ_PRIVATE_KEY_MOM
      remoteRef:
        key: HERMES_BUZZ_PRIVATE_KEY_MOM
    - secretKey: HERMES_BUZZ_PRIVATE_KEY_MORBO
      remoteRef:
        key: HERMES_BUZZ_PRIVATE_KEY_MORBO
    - secretKey: HERMES_BUZZ_PRIVATE_KEY_NIBBLER
      remoteRef:
        key: HERMES_BUZZ_PRIVATE_KEY_NIBBLER
    - secretKey: HERMES_BUZZ_PRIVATE_KEY_NIXON
      remoteRef:
        key: HERMES_BUZZ_PRIVATE_KEY_NIXON
    - secretKey: HERMES_BUZZ_PRIVATE_KEY_WERNSTROM
      remoteRef:
        key: HERMES_BUZZ_PRIVATE_KEY_WERNSTROM
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-github-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: hermes-github-app
    template:
      data:
        # Git credential username and commit identity. Any value authenticates —
        # the installation token is the password — so keep it aligned with the
        # App's bot login for readable commit authorship.
        GH_APP_USERNAME: "hermes[bot]"
        GH_APP_ID: "{{ .GH_APP_ID }}"
        GH_APP_CLIENT_ID: "{{ .GH_APP_CLIENT_ID }}"
        GH_APP_INSTALLATION_ID: "{{ .GH_APP_INSTALLATION_ID }}"
        GH_APP_PRIVATE_KEY: "{{ .GH_APP_PRIVATE_KEY }}"
  data:
    - secretKey: GH_APP_ID
      remoteRef:
        key: HERMES_GH_APP_ID
    - secretKey: GH_APP_CLIENT_ID
      remoteRef:
        key: HERMES_GH_APP_CLIENT_ID
    - secretKey: GH_APP_INSTALLATION_ID
      remoteRef:
        key: HERMES_GH_APP_INSTALLATION_ID
    - secretKey: GH_APP_PRIVATE_KEY
      remoteRef:
        key: HERMES_GH_APP_PRIVATE_KEY
