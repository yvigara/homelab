# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: dex-hermes-secret
    template:
      data:
        HERMES_DASHBOARD_CLIENT_SECRET: "{{ .HERMES_DASHBOARD_CLIENT_SECRET }}"
  data:
    - secretKey: HERMES_DASHBOARD_CLIENT_SECRET
      remoteRef:
        key: HERMES_DASHBOARD_CLIENT_SECRET
