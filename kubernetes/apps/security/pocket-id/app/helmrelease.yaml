# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pocket-id
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      pocket-id:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/pocket-id/pocket-id
              tag: v2.13.0@sha256:c9c1d7b70006968d673a1073df048a3fdec73ccb54e182320b56bb911340f6f1
            env:
              APP_URL: "https://id.${DOMAIN}"
              TRUST_PROXY: true
              # the provider is derived from the connection string scheme, no DB_PROVIDER needed
              DB_CONNECTION_STRING:
                valueFrom:
                  secretKeyRef:
                    name: pocket-id-secret
                    key: DB_CONNECTION_STRING
              ENCRYPTION_KEY_FILE: /encryption/ENCRYPTION_KEY
              UPLOAD_PATH: /app/data/uploads
              ANALYTICS_DISABLED: true
              METRICS_ENABLED: true
              OTEL_METRICS_EXPORTER: prometheus
              OTEL_EXPORTER_PROMETHEUS_HOST: 0.0.0.0
              OTEL_EXPORTER_PROMETHEUS_PORT: &metrics_port 9464
              TZ: ${TIMEZONE}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &app_port 1411
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: *app
        ports:
          http:
            primary: true
            port: *app_port
          metrics:
            port: *metrics_port
    serviceMonitor:
      app:
        service:
          identifier: app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - "id.${DOMAIN}"
        parentRefs:
          - name: traefik-public
            namespace: network
            sectionName: websecure
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /app/data
      encryption:
        type: secret
        name: pocket-id-secret
        globalMounts:
          - path: /encryption/ENCRYPTION_KEY
            subPath: ENCRYPTION_KEY
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
