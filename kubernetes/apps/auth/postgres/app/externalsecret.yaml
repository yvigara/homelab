# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Owner credentials for the two Ory CNPG databases. CNPG's bootstrap.initdb.secret
# consumes the `username`/`password` keys (kubernetes.io/basic-auth). The same
# passwords are used to build the Hydra/Kratos DSNs in their own ExternalSecrets,
# so both sides stay consistent as long as the Bitwarden values don't change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hydra-postgres-owner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: hydra-postgres-owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "hydra"
        password: "{{ .ORY_HYDRA_DB_PASSWORD }}"
  data:
    - secretKey: ORY_HYDRA_DB_PASSWORD
      remoteRef:
        key: ORY_HYDRA_DB_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kratos-postgres-owner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: kratos-postgres-owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "kratos"
        password: "{{ .ORY_KRATOS_DB_PASSWORD }}"
  data:
    - secretKey: ORY_KRATOS_DB_PASSWORD
      remoteRef:
        key: ORY_KRATOS_DB_PASSWORD
