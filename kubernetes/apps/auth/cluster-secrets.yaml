apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets
type: Opaque
# GitHub OAuth App creds (reused from Dex), substituted from the global cluster-secrets
# at apply time. Picked up by every auth child Kustomization via the inherited
# postBuild.substituteFrom (kind: Secret, name: cluster-secrets), e.g. in the Kratos config.
stringData:
  DEX_GITHUB_CLIENT_ID: ${DEX_GITHUB_CLIENT_ID}
  DEX_GITHUB_CLIENT_SECRET: ${DEX_GITHUB_CLIENT_SECRET}
