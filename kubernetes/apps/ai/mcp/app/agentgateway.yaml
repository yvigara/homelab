apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp
spec:
  mcp:
    targets:
      - name: searxng
        selector:
          services:
            matchLabels:
              app.kubernetes.io/instance: mcp-searxng
      - name: linkedin
        static:
          host: ${OLLAMA_SRV1_IP}
          port: 9080
          protocol: StreamableHTTP
      - name: memini
        static:
          host: memini.ai.svc.cluster.local
          port: 8080
          protocol: StreamableHTTP
          policies:
            auth:
              secretRef:
                name: memini
      # beads is out until its bd-serve sidecar runs: the image has no git, so
      # `bd serve` cannot resolve a workspace and the pod crashloops. While a
      # target has no endpoints, `initialize` fails for every target. Restore:
      #   - name: beads
      #     static:
      #       host: beads-mcp.ai.svc.cluster.local
      #       port: 3000
      #       protocol: StreamableHTTP
      # beads-mcp verifies Cf-Access-Jwt-Assertion itself (see ../../beads-mcp).
---
# No JWT policy on this route. Authentication for mcp.${DOMAIN} is Cloudflare Access
# with Managed OAuth, enforced at the edge and re-checked by cloudflared
# (kubernetes/core/network/cloudflare-tunnel). Access hands the client an opaque
# token and serves the discovery metadata itself, so agentgateway has nothing to
# validate or advertise. The signed Cf-Access-Jwt-Assertion header is forwarded to
# the targets; beads-mcp verifies it. See ../README.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: mcp
          kind: AgentgatewayBackend
          group: agentgateway.dev
