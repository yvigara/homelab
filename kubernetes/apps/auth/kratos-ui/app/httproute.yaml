# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Login / consent / settings screens (also serves Hydra's login+consent UI).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kratos-ui
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  hostnames:
    - "login.${DOMAIN}"
  parentRefs:
    - name: traefik-public
      namespace: network
      sectionName: websecure
  rules:
    - backendRefs:
        - name: kratos-ui
          port: 3000
