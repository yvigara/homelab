# Reads the minted token back out of this namespace so it can be handed to other namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghcr-token-reader
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.32.0-standalone-strict/role-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ghcr-token-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ghcr-token"]
    verbs: ["get", "list", "watch"]
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.32.0-standalone-strict/rolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ghcr-token-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ghcr-token-reader
subjects:
  - kind: ServiceAccount
    name: ghcr-token-reader
    namespace: external-secrets
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.32.0-standalone-strict/clusterrole-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ghcr-token-reader
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.32.0-standalone-strict/clusterrolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ghcr-token-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ghcr-token-reader
subjects:
  - kind: ServiceAccount
    name: ghcr-token-reader
    namespace: external-secrets
---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ghcr-token
spec:
  provider:
    kubernetes:
      remoteNamespace: external-secrets
      server:
        # server.url defaults to the in-cluster API server; only the CA needs naming.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: ghcr-token-reader
          namespace: external-secrets
