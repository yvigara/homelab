# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dolt-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: dolt-credentials
    template:
      data:
        # `user`/`password` are what bd connects with; dolt-sql creates that
        # user on first boot and grants it ALL on the `beads` database only.
        user: beads
        password: "{{ .BEADS_DOLT_PASSWORD }}"
        root-password: "{{ .BEADS_DOLT_ROOT_PASSWORD }}"
  data:
    - secretKey: BEADS_DOLT_PASSWORD
      remoteRef:
        key: BEADS_DOLT_PASSWORD
    - secretKey: BEADS_DOLT_ROOT_PASSWORD
      remoteRef:
        key: BEADS_DOLT_ROOT_PASSWORD
