# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-server-cert
spec:
  secretName: postgres-server-cert
  duration: 168h
  renewBefore: 24h
  issuerRef:
    name: cluster-ca
    kind: ClusterIssuer
    group: cert-manager.io
  commonName: postgres
  dnsNames:
    - postgres-rw
    - postgres-ro
    - postgres-r
    - postgres-rw.database.svc
    - postgres-ro.database.svc
    - postgres-r.database.svc
    - postgres-rw.database.svc.cluster.local
    - postgres-ro.database.svc.cluster.local
    - postgres-r.database.svc.cluster.local
  subject:
    countries:
      - AU
    organizations:
      - celestio
  usages:
    - server auth
  privateKey:
    algorithm: ECDSA
    size: 384
    encoding: PKCS8
    rotationPolicy: Always
  secretTemplate:
    labels:
      cnpg.io/reload: ""
