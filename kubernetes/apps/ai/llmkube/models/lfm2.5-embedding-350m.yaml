# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: lfm2.5-embedding-350m
spec:
  format: gguf
  quantization: Q8_0
  source: https://huggingface.co/LiquidAI/LFM2.5-Embedding-350M-GGUF/resolve/main/LFM2.5-Embedding-350M-Q8_0.gguf
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: lfm2.5-embedding-350m
spec:
  modelRef: lfm2.5-embedding-350m
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-b10666@sha256:991cf50e9eb7dee4c18090849c7f909bafc5a1884cdde2dc3011df7407da09d6
  replicas: 1
  podSecurityContext:
    # 102 = curlimages/curl curl_group GID; makes the /models emptyDir
    # writable by the model-downloader init container (we override the
    # chart's default fsGroup by supplying podSecurityContext).
    fsGroup: 102
    supplementalGroups:
      - 44
      - 992
  # per-slot ctx = contextSize/parallelSlots; 2 slots = 4096, enough for long memini docs.
  contextSize: 8192
  parallelSlots: 2
  batchSize: 8192
  uBatchSize: 4096
  resources:
    gpu: 0
    cpu: 100m
    memory: 2Gi
  extraArgs:
    # Qwen3-Embedding uses last-token pooling with left padding;
    # --embedding + --pooling last exposes the OpenAI-compatible
    # /v1/embeddings endpoint.
    - --embedding
    - --pooling
    - last
    - --cache-ram
    - "0"
    - --no-mmap
    - --sleep-idle-seconds
    - "300"
    - --alias
    - lfm2.5-embedding-350m
    - --metrics
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 60
    liveness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 30
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 3
