# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-knowledge
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # The node images ship a `node` user at 1000:1000; the PVC is handed to
        # it via fsGroup so the CLI install and the git tree are both writable.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      open-knowledge:
        annotations:
          reloader.stakater.com/auto: "true"
        # The collaboration server is single-writer: exactly one process per
        # project volume. Recreate (not RollingUpdate) keeps a new pod from
        # attaching to the volume while the old one still holds it.
        replicas: 1
        strategy: Recreate
        initContainers:
          install:
            image: &app_image
              repository: docker.io/library/node
              # The full Debian variant, not -slim: git is a hard boot
              # requirement (the server runs a git preflight, and the timeline
              # and recovery subsystems shell out to the binary), and only this
              # variant already carries it.
              tag: 24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
            command: ["bash", "/run/config/install.sh"]
            env:
              HOME: &data_dir /data
              # Global npm prefix on the volume, deliberately outside the
              # project dir so node_modules never lands in the knowledge base.
              NPM_CONFIG_PREFIX: &npm_prefix /data/.npm-global
              OK_PROJECT_DIR: &project_dir /data/project
              # renovate: datasource=npm depName=@inkeep/open-knowledge
              OK_VERSION: &ok_version 0.61.3
              GIT_AUTHOR_NAME: &git_name open-knowledge
              GIT_AUTHOR_EMAIL: &git_email open-knowledge@${DOMAIN}
              # The knowledge base lives in its own repo, cloned over SSH with
              # the generated deploy key. Full sync means the server commits and
              # pushes back, so that key needs write access.
              OK_GIT_REMOTE: &git_remote git@github.com:yvigara/lifeos.git
              OK_GIT_BRANCH: &git_branch main
              PATH: &path /data/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: open-knowledge-deploy-key
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
        containers:
          app:
            image: *app_image
            command: ["bash", "/run/config/start.sh"]
            # OpenKnowledge resolves settings as CLI flags > environment >
            # project-local config > project config > user config > defaults.
            # The environment sits above every config file, so an OK_* set here
            # is not merely a default - it cannot be adjusted anywhere else.
            # That is the right shape for what belongs to the container: the
            # port the Service targets, the address it binds, the exposure
            # consent, and the public origin the ingress answers on. Settings
            # that belong to this instance rather than to the container - idle
            # shutdown, the sync mode - live in the project-local config layer
            # instead, rendered by resources/local-config.yml.
            env:
              HOME: *data_dir
              NPM_CONFIG_PREFIX: *npm_prefix
              OK_PROJECT_DIR: *project_dir
              OK_VERSION: *ok_version
              GIT_AUTHOR_NAME: *git_name
              GIT_AUTHOR_EMAIL: *git_email
              OK_GIT_REMOTE: *git_remote
              OK_GIT_BRANCH: *git_branch
              PATH: *path
              TZ: ${TIMEZONE}
              PORT: &app_port 8080
              # Reachable from the pod network. A wildcard bind contributes no
              # admitted Host name of its own, which is why OK_EXTERNAL_URL
              # below is the only non-loopback host the server answers to.
              OK_BIND: 0.0.0.0
              # Exposure consent interlock — without it the server refuses to boot.
              OK_ALLOW_EXTERNAL: "1"
              # The canonical public origin. It is both the sole Host allowlist
              # entry and the origin the server builds its wss:// and preview
              # URLs from, so every caller — browsers through the Cloudflare
              # tunnel, and Hermes in-cluster — has to present this exact Host
              # or get a 403.
              OK_EXTERNAL_URL: https://ok.${DOMAIN}
            probes:
              # /healthz and /readyz are mounted above every admission gate
              # precisely so orchestrator probes — which arrive with an IP Host
              # header — are not refused.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *app_port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *app_port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              startup:
                enabled: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    service:
      app:
        controller: open-knowledge
        ports:
          # The one listener. Public browser traffic (via Cloudflare Access)
          # and Hermes' direct /mcp calls both land here.
          http:
            port: *app_port
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - ok.${DOMAIN}
        parentRefs:
          - name: traefik-public
            namespace: network
            sectionName: websecure
        rules:
          # The editor, and nothing else worth splitting out. `/mcp` is served
          # on this listener too but is not published: the only consumer is
          # Hermes, in-cluster, and there is no public MCP edge for this app.
          # Authentication happens at the Cloudflare edge (Access), not in the
          # cluster — see the README.
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: open-knowledge
        globalMounts:
          - path: *data_dir
      config:
        type: configMap
        name: open-knowledge-configmap
        defaultMode: 0555
        advancedMounts:
          open-knowledge:
            install:
              - path: /run/config
            app:
              - path: /run/config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
