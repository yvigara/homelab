# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radar-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: radar-oidc
    template:
      data:
        client-secret: "{{ .RADAR_OIDC_CLIENT_SECRET }}"
  data:
    - secretKey: RADAR_OIDC_CLIENT_SECRET
      remoteRef:
        key: RADAR_OIDC_CLIENT_SECRET
