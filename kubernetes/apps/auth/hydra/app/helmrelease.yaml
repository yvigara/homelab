# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hydra
spec:
  interval: 1h
  chart:
    spec:
      chart: hydra
      version: 0.62.1
      sourceRef:
        kind: HelmRepository
        name: ory
        namespace: flux-system
      interval: 12h
  values:
    # deterministic resource names -> services `hydra-public` / `hydra-admin`
    fullnameOverride: hydra

    # run the schema migration as a Job before the deployment rolls out
    hydra:
      automigration:
        enabled: true
        type: job
      config:
        serve:
          public:
            port: 4444
            # MCP browser clients (e.g. ChatGPT) hit /openid/register, /oauth2/token
            # and the discovery documents cross-origin.
            cors:
              enabled: true
              allowed_origins:
                - https://mcp.${DOMAIN}
                - https://chat.openai.com
                - https://claude.ai
              allowed_methods: [GET, POST, PUT, DELETE]
              allowed_headers: [Authorization, Content-Type]
          admin:
            port: 4445
          cookies:
            same_site_mode: Lax
        urls:
          self:
            issuer: https://auth.${DOMAIN}
            public: https://auth.${DOMAIN}
          # login/consent/logout screens are served by the Kratos self-service UI
          login: https://login.${DOMAIN}/login
          consent: https://login.${DOMAIN}/consent
          logout: https://login.${DOMAIN}/logout
          # Kratos admin API drives Hydra's logout / session revocation
          identity_provider:
            url: http://kratos-admin.auth.svc.cluster.local:80
        # JWT access tokens so AgentGateway can validate via Hydra's JWKS
        strategies:
          access_token: jwt
        # RFC 7591/7592 Dynamic Client Registration for MCP clients
        oidc:
          dynamic_client_registration:
            enabled: true
        oauth2:
          expose_internal_errors: false
        ttl:
          access_token: 1h
          refresh_token: 720h
          id_token: 1h
          auth_code: 10m

    # provide DSN + system/cookie secrets from our ExternalSecret instead of a
    # chart-generated one (keys: dsn, secretsSystem, secretsCookie)
    secret:
      enabled: false
      nameOverride: hydra-secret

    # hydra-maester reconciles OAuth2Client CRDs (used to declare the hermes
    # dashboard client, and MCP clients in phase 2)
    maester:
      enabled: true

    # we expose Hydra through Gateway API (Traefik), not the chart's Ingress
    ingress:
      public:
        enabled: false
      admin:
        enabled: false

    deployment:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
