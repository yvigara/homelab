# Bender - forge, dispatches into Claude Code.
model:
  default: Qwen3.5-9B-MLX-4bit
  provider: custom:k8s-omlx
custom_providers:
  - name: k8s-omlx
    base_url: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/omlx
    api_key: "${HERMES_OMLX_KEY}"
    default_model: Qwen3.5-9B-MLX-4bit
    models:
      Qwen3.5-9B-MLX-4bit:
        context_length: 77824
      gemma-4-e4b-it-qat-OptiQ-4bit:
        context_length: 110592
auxiliary:
  compression:
    provider: custom:k8s-omlx
    model: gemma-4-e4b-it-qat-OptiQ-4bit
  session_search:
    provider: custom:k8s-omlx
    model: Qwen3.5-9B-MLX-4bit
  title_generation:
    provider: custom:k8s-omlx
    model: Qwen3.5-9B-MLX-4bit
toolsets:
  - hermes-cli
platform_toolsets:
  cli:
    - clarify
    - file
    - terminal
    - todo
  buzz:
    - clarify
    - file
    - terminal
    - todo
agent:
  max_turns: 40
  reasoning_effort: medium
  tool_use_enforcement: auto
  disabled_toolsets:
    - homeassistant
    - spotify
    - computer_use
    - browser
    - tts
    - stt
    - cronjob
    - delegation
terminal:
  backend: local
  cwd: /opt/data/profiles/bender/workspace
  timeout: 1800
  persistent_shell: true
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
memory:
  memory_enabled: false
web:
  search_backend: searxng
security:
  allow_private_urls: false
  redact_secrets: true
privacy:
  redact_pii: true
approvals:
  mode: smart
  timeout: 60
  cron_mode: deny
mcp_servers:
  obsidian:
    url: http://${OLLAMA_SRV1_IP}:27124/mcp
    headers:
      Authorization: "${OBSIDIAN_AUTH_HEADER}"
display:
  platforms:
    buzz:
      interim_assistant_messages: false
      tool_progress: 'off'
gateway:
  message_timestamps:
    enabled: true
  platforms:
    buzz:
      enabled: true
      extra:
        transport: auto
        require_mention: true
        poll_interval: 4
        allow_all_users: false
