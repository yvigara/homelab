apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://helm.traefik.io/traefik
      chart: traefik
      version: 39.0.8
      sourceRef:
        kind: HelmRepository
        name: traefik-charts
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deployment:
      enabled: true
      replicas: 2
    tlsStore:
      default:
        defaultCertificate:
          secretName: "${DOMAIN/./-}-tls"
    tlsOptions:
      default:
        minVersion: VersionTLS12
        maxVersion: VersionTLS13
        sniStrict: true
    rbac:
      enabled: true
    ingressClass:
      enabled: true
      isDefaultClass: true
    ingressRoute:
      dashboard:
        enabled: false
    providers:
      kubernetesCRD:
        enabled: true
        allowExternalNameServices: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        allowExternalNameServices: true
      kubernetesGateway:
        enabled: true
        # This option currently enables support for TCPRoute and TLSRoute.
        experimentalChannel: true
    gateway:
      annotations:
        external-dns.alpha.kubernetes.io/target: "tun.${CLUSTER_NAME}.${DOMAIN}"
      listeners:
        web:
          port: 8000
          protocol: HTTP
          namespacePolicy:
            from: All
        websecure:
          port: 8443
          protocol: HTTPS
          namespacePolicy:
            from: All
          certificateRefs:
            - kind: Secret
              name: "${DOMAIN/./-}-tls"
    additionalArguments:
      - "--api.insecure=true"
      - "--providers.kubernetesingress.ingressclass=traefik"
      - "--providers.kubernetesingress.ingressendpoint.ip=${LB_INT_IP}"
      - "--providers.kubernetescrd.allowexternalnameservices=true"
    ports:
      websecure:
        http3:
          enabled: true
    service:
      type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: ${LB_INT_IP}
      spec:
        externalTrafficPolicy: Cluster
    logs:
      general:
        level: "INFO"
      access:
        enabled: true
