apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-cloudflare
spec:
  releaseName: external-dns-cloudflare
  chart:
    spec:
      # renovate: registryUrl=https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      version: 1.20.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  interval: 10m
  values:
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-secret
            key: CF_API_TOKEN
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
    registry: txt
    txtPrefix: k8s.
    txtOwnerId: "${CLUSTER_NAME}"
    provider: cloudflare
    triggerLoopOnEvent: true
    policy: sync
    domainFilters:
      - ${DOMAIN}
    sources:
      - crd
      - service
      - ingress
      - gateway-httproute
      - gateway-grpcroute
      - gateway-tlsroute
      - gateway-tcproute
      - gateway-udproute
    enableGatewayListenerSets: true
    serviceMonitor:
      enabled: true
    resources:
      requests:
        memory: 100Mi
        cpu: 25m
      limits:
        memory: 250Mi
    podAnnotations:
      secret.reloader.stakater.com/reload: cloudflare
