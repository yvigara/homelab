# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate-operator
spec:
  targetNamespace: renovate
  path: ./kubernetes/apps/renovate/renovate-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: renovate-operator
      namespace: renovate
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# The RenovateJob is a CR of the CRD the chart installs, so it can only be applied
# once the HelmRelease above is healthy. Splitting it into its own Kustomization is
# what makes that ordering explicit to Flux.
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate-operator-config
spec:
  targetNamespace: renovate
  path: ./kubernetes/apps/renovate/renovate-operator/config
  prune: true
  dependsOn:
    - name: renovate-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 5m
