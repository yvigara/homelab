# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
spec:
  interval: 5m
  chart:
    spec:
      chart: dex
      version: 0.24.1
      sourceRef:
        kind: HelmRepository
        name: dex
        namespace: flux-system
      interval: 10m
  values:
    image:
      repository: dexidp/dex
      tag: v2.45.1
    httpRoute:
      enabled: true
      annotations:
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
      hostnames:
        - "dex.${DOMAIN}"
      parentRefs:
        - name: traefik-public
          namespace: network
          sectionName: websecure
    config:
      issuer: "https://dex.${DOMAIN}"
      storage:
        type: kubernetes
        config:
          inCluster: true
      oauth2:
        alwaysShowLoginScreen: false
        responseTypes: ["code", "token", "id_token"]
        skipApprovalScreen: true
      web:
        http: 0.0.0.0:5556
      frontend:
        theme: "tectonic"
        issuer: "Celestio SSO"
        issuerUrl: "https://dex.${DOMAIN}"
        logoUrl: https://avatars.githubusercontent.com/u/72014580?s=200&v=4
      expiry:
        signingKeys: "6h"
        idTokens: "24h"
      logger:
        level: debug
        format: json
      # Disable default email auth and only use oauth2 providers configured as connectors
      enablePasswordDB: false
      # Remember you can have multiple connectors of the same 'type' (with different 'id's)
      # If you need e.g. logins with groups for two different Microsoft 'tenants'
      connectors:
        # GitHub configure 'OAuth Apps' -> 'New OAuth App', add callback URL
        # https://github.com/settings/developers
        - type: github
          id: github
          name: GitHub
          config:
            clientID: ${DEX_GITHUB_CLIENT_ID}
            clientSecret: ${DEX_GITHUB_CLIENT_SECRET}
            redirectURI: "https://dex.${DOMAIN}/callback"
            # 'orgs' can be used to map groups from Github
            # https://github.com/coreos/dex/blob/master/Documentation/connectors/github.md
            orgs:
              - name: celest-io
      staticClients:
        - id: hermes-dashboard
          redirectURIs:
            - "https://hermes.int.${REGION}.${ENVIRONMENT}.${DOMAIN}/auth/callback"
          name: "Hermes Dashboard"
          public: true
        - id: hermes-dashboard-public
          redirectURIs:
            - "https://hermes.${DOMAIN}/auth/callback"
          name: "Hermes Dashboard"
          public: true
        - id: rustfs
          redirectURIs:
            - "https://rustfs.int.${REGION}.${ENVIRONMENT}.${DOMAIN}/rustfs/admin/v3/oidc/callback/default"
          name: "RustFS"
          secret: ${RUSTFS_OIDC_CLIENT_SECRET}
        # Browser login for the OpenKnowledge editor, enforced by the
        # oauth2-proxy sidecar in kubernetes/apps/ai/open-knowledge. The app
        # itself has no user accounts, so this is the only thing standing
        # between the public hostname and full read/write access.
        - id: open-knowledge
          redirectURIs:
            - "https://ok.${DOMAIN}/oauth2/callback"
          name: "OpenKnowledge"
          secret: ${OPEN_KNOWLEDGE_OIDC_CLIENT_SECRET}
