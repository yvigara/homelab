# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/clusterexternalsecret_v1.json
#
# Renders the token minted in ./externalsecret.yaml into a docker config and drops it
# into every namespace that asks for it, as a Secret named ghcr-credentials. It reads
# through ./secretstore.yaml rather than invoking the generator directly, because the
# generator would look for the App private key in the consuming namespace.
#
# Two selectors, ORed:
#   - flux-system, matched on the label the API server puts on every namespace, so
#     source-controller can pull private charts and OCI artifacts. Reference it with
#     `spec.secretRef: {name: ghcr-credentials}` on the OCIRepository or HelmRepository.
#   - any namespace labelled ghcr-pull=true, for workloads whose images are private.
#     Label the namespace, then point the workload at the Secret — for an app-template
#     HelmRelease that is `values.defaultPodOptions.imagePullSecrets: [{name: ghcr-credentials}]`.
#     Namespaces are not labelled by default, so no unused credential is created.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: ghcr-credentials
spec:
  externalSecretName: ghcr-credentials
  refreshTime: 1h
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: flux-system
    - matchLabels:
        ghcr-pull: "true"
  externalSecretSpec:
    refreshInterval: 15m
    secretStoreRef:
      kind: ClusterSecretStore
      name: ghcr-token
    target:
      name: ghcr-credentials
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          # x-access-token is the conventional username for a GitHub App
          .dockerconfigjson: |
            {
              "auths": {
                "ghcr.io": {
                  "username": "x-access-token",
                  "password": "{{ .token }}",
                  "auth": "{{ printf "x-access-token:%s" .token | b64enc }}"
                }
              }
            }
    data:
      - secretKey: token
        remoteRef:
          key: ghcr-token
          property: token
