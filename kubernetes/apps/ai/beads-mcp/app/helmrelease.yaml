# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app beads
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  dependsOn:
    - name: dolt-sql
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        replicas: 1
        containers:
          app:
            # bd 1.3.4 plus git, built from images/bd-serve. `bd serve` needs a
            # git repository root, so the workspace is `git init`ed first.
            image:
              repository: ghcr.io/yvigara/bd-serve
              tag: 1.3.4@sha256:a130d47fe626be01995b16f2bee2d582a0a7ba87f3a037a1d755bc760d5250b1
            workingDir: /data/project
            command: ["/bin/sh", "-ec"]
            # dolt-sql may still be starting; retry init instead of crashlooping.
            # --init-if-missing never reinitializes an existing database.
            args:
              - >-
                [ -d .git ] || git init -q;
                git config user.name beads-serve;
                git config user.email beads-serve@${DOMAIN};
                bd metrics off || true;
                attempt=0;
                until bd init --init-if-missing --external --server
                --server-host=dolt-sql --server-port=3306
                --server-user="$DOLT_USER" --database=beads
                --prefix=task --skip-agents --skip-hooks --non-interactive; do
                attempt=$((attempt + 1)); [ "$attempt" -lt 30 ] || exit 1;
                sleep 2; done;
                exec bd serve --addr=0.0.0.0:8742 --allow-non-loopback
                --auth-token-file="$BEADS_SERVE_TOKEN_FILE"
                --allowed-host=beads.${DOMAIN}
                --allowed-host=beads.ai.svc.cluster.local
                --allowed-host=beads
            env:
              TZ: ${TIMEZONE}
              HOME: /data/project
              BEADS_PROJECT_DIR: /data/project
              BEADS_DIR: /data/project/.beads
              BEADS_ACTOR: beads-serve
              BEADS_SERVE_TOKEN_FILE: /run/secrets/beads/tokens
              # Env wins over metadata.json, so `bd init` does not have to
              # record the deprecated dolt_server_port.
              BEADS_DOLT_SERVER_HOST: dolt-sql
              BEADS_DOLT_SERVER_PORT: "3306"
              DOLT_USER:
                valueFrom:
                  secretKeyRef:
                    name: dolt-credentials
                    key: user
              BEADS_DOLT_SERVER_USER:
                valueFrom:
                  secretKeyRef:
                    name: dolt-credentials
                    key: user
              BEADS_DOLT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: dolt-credentials
                    key: password
            probes:
              # /healthz is the one endpoint bd serve leaves unauthenticated and
              # never touches the database.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8742
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      # bd workspace config only; the data lives in dolt-sql.
      workspace:
        type: emptyDir
        globalMounts:
          - path: /data/project
      token:
        type: secret
        name: beads-serve-token
        globalMounts:
          - path: /run/secrets/beads
            readOnly: true
