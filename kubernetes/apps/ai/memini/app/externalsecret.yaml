# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: memini
    creationPolicy: Owner
    template:
      data:
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        Authorization: "Bearer {{ .MEMINI_API_KEY }}"
        MEMINI_POSTGRES_DSN: "postgresql://memini:{{ .MEMINI_PG_PASSWORD }}@postgres-rw.database.svc/memini?sslmode=disable"
  data:
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: MEMINI_API_KEY
    - secretKey: MEMINI_PG_PASSWORD
      remoteRef:
        key: MEMINI_PG_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini-postgres
spec:
  refreshInterval: "0"
  target:
    name: memini-postgres
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: "memini"
        password: "{{ .MEMINI_PG_PASSWORD }}"
  data:
    - secretKey: MEMINI_PG_PASSWORD
      remoteRef:
        key: MEMINI_PG_PASSWORD
