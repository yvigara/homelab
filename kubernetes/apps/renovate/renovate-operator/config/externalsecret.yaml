# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# GitHub App credentials for Renovate. The operator reads these three keys, signs a
# JWT, and exchanges it with GitHub for a short-lived installation access token that
# it writes into an auto-managed Secret as RENOVATE_TOKEN. No PAT is involved, and
# no long-lived token is ever stored in the cluster.
#
# The token GitHub returns is an installation token (ghs_…), which is what makes
# Renovate treat itself as a GitHub App and commit through the API — see the
# platformCommit note in config/renovatejob.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: renovate-github-app
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # spec.githubAppReference names both a Secret and the keys to read from it,
          # and the operator resolves them with its own credentials. With
          # policy.requireSecretRefOptIn on, a Secret has to opt in to being read that
          # way; only the literal string "true" counts.
          renovate-operator.mogenius.com/allow-ref: "true"
      data:
        APP_ID: "{{ .appId }}"
        INSTALLATION_ID: "{{ .installationId }}"
        PEM: "{{ .privateKey }}"
  data:
    - secretKey: appId
      remoteRef:
        key: RENOVATE_GH_APP_ID
    - secretKey: installationId
      remoteRef:
        key: RENOVATE_GH_APP_INSTALLATION_ID
    - secretKey: privateKey
      remoteRef:
        key: RENOVATE_GH_APP_PRIVATE_KEY
---
# Shared secret for inbound webhook deliveries. The operator attaches it to every
# repository webhook it creates, GitHub then signs each delivery with it as
# X-Hub-Signature-256, and the operator verifies that signature before acting.
# Nothing is configured by hand on the GitHub side — see webhook.sync in
# ./renovatejob.yaml.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-webhook-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: renovate-webhook-token
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # webhook.authentication.secretRef and webhook.sync.secretRef are both
          # arbitrary-key references, so this Secret has to opt in too. Without the
          # label sync writes nothing and deliveries fail authentication.
          renovate-operator.mogenius.com/allow-ref: "true"
      data:
        token: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: RENOVATE_WEBHOOK_TOKEN
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name docker-hub-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: *name
    template:
      data:
        DOCKERHUB_USERNAME: "{{ .username }}"
        DOCKERHUB_TOKEN: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: RENOVATE_DOCKER_USERNAME
    - secretKey: password
      remoteRef:
        key: RENOVATE_DOCKERHUB_TOKEN
