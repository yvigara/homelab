# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Produces the secret the Hydra chart consumes (secret.nameOverride: hydra-secret,
# secret.enabled: false). The chart reads keys: dsn, secretsSystem, secretsCookie.
# The DSN password must match ORY_HYDRA_DB_PASSWORD used by the CNPG owner secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hydra
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: hydra-secret
    template:
      data:
        dsn: "postgres://hydra:{{ .ORY_HYDRA_DB_PASSWORD }}@hydra-postgres-rw.auth.svc.cluster.local:5432/hydra?sslmode=require"
        secretsSystem: "{{ .ORY_HYDRA_SECRETS_SYSTEM }}"
        secretsCookie: "{{ .ORY_HYDRA_SECRETS_COOKIE }}"
  data:
    - secretKey: ORY_HYDRA_DB_PASSWORD
      remoteRef:
        key: ORY_HYDRA_DB_PASSWORD
    - secretKey: ORY_HYDRA_SECRETS_SYSTEM
      remoteRef:
        key: ORY_HYDRA_SECRETS_SYSTEM
    - secretKey: ORY_HYDRA_SECRETS_COOKIE
      remoteRef:
        key: ORY_HYDRA_SECRETS_COOKIE
