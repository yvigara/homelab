# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-knowledge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: open-knowledge-secret
    template:
      data:
        # Dex staticClient credentials for the browser login edge. The client is
        # declared in kubernetes/core/network/dex/app/helmrelease.yaml.
        OAUTH2_PROXY_CLIENT_SECRET: "{{ .OPEN_KNOWLEDGE_OIDC_CLIENT_SECRET }}"
        # Must decode to 16, 24 or 32 bytes — `openssl rand -hex 16`.
        # A base64 32-char value is 44 characters and oauth2-proxy refuses to start.
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .OPEN_KNOWLEDGE_COOKIE_SECRET }}"
  data:
    - secretKey: OPEN_KNOWLEDGE_OIDC_CLIENT_SECRET
      remoteRef:
        key: OPEN_KNOWLEDGE_OIDC_CLIENT_SECRET
    - secretKey: OPEN_KNOWLEDGE_COOKIE_SECRET
      remoteRef:
        key: OPEN_KNOWLEDGE_COOKIE_SECRET
