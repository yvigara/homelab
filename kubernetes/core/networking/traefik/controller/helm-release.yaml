apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://helm.traefik.io/traefik
      chart: traefik
      version: 39.0.8
      sourceRef:
        kind: HelmRepository
        name: traefik-charts
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik-internal
    gateway:
      name: traefik-internal
      listeners:
        web:
          namespacePolicy:
            from: All
    ingressRoute:
      dashboard:
        enabled: true
        entryPoints:
          - web
    providers:
      kubernetesIngress:
        enabled: true
      kubernetesGateway:
        enabled: true
        # This option currently enables support for TCPRoute and TLSRoute.
        experimentalChannel: true
    ports:
      websecure:
        http3:
          enabled: true
    service:
      type: LoadBalancer
      spec:
        externalTrafficPolicy: Cluster
        annotations:
          metallb.io/loadBalancerIPs: 192.168.2.129
